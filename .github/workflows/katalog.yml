name: Supplement-Katalog
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "run = Katalog + Bilder, bilder = nur Bilder"
        default: run
  push:
    paths: ["tools/katalog-*.mjs", "tools/bilder-sync.mjs", ".github/workflows/katalog.yml", "tools/katalog-run.txt"]
permissions:
  contents: write
concurrency: katalog
jobs:
  katalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get install -y -q poppler-utils >/dev/null || true
      - run: |
          if [ "${{ github.event.inputs.modus }}" != bilder ]; then node tools/katalog-$(cat tools/katalog-run.txt 2>/dev/null || echo probe).mjs; fi
      - run: |
          if [ "$(cat tools/katalog-run.txt)" = run ]; then node tools/bilder-sync.mjs; fi
      - run: |
          git config user.name "atlas-katalog-bot"
          git config user.email "atlas-katalog-bot@users.noreply.github.com"
          git add katalog
          git commit -m "Katalog: automatischer Lauf" || echo "nichts zu committen"
          git pull --rebase && git push
