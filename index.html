<style>
:root{--bg:#0b1214;--panel:#121d21;--panel2:#0f181b;--line:#22343a;--fg:#e7efed;--muted:#8ea3a2;--accent:#e8935a;--accent-2:#f6c08f;--ink:#1a0f08;--glow:rgba(232,147,90,.15);--ok:#6fcf97;--teal:#7fd1c7;
--f-display:"Unbounded","Arial Black",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Hauptbildschirm: nur die Kugel. Alles andere liegt hinter dem Code. */
.top,.dock,#typeForm,.said,.heard,.state{display:none!important}
#app{grid-template-rows:1fr auto!important}
.corner{position:fixed;z-index:15;width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;color:var(--muted);opacity:.28;font-size:20px;display:grid;place-items:center;transition:opacity .2s}
.corner:hover,.corner:focus-visible{opacity:.9;border-color:var(--line)}
#menuBtn{top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px)}
#fullBtn{top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 10px)}
body.away #menuBtn{display:none!important}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 140px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
body.away .dock,body.away #typeForm,body.away #personChip,body.away #lockBtn,body.away #setupBar,body.away #sheet,body.away #codeModal,body.away #askModal,body.away .said,body.away .heard{display:none!important}
.awaybar{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:center;max-width:40ch}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:38px;height:38px;border-radius:10px}
.who{flex:1;min-width:0}
.who .n{font-family:var(--f-display);font-size:17px;line-height:1.1}
.who .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.kind{border-color:var(--teal)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:17px;flex:none}
.iconbtn.open{border-color:var(--ok)}
.clock{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:430px){.clock{font-size:18px}.who .d{display:none}.top{gap:8px}}
.stage{display:grid;place-items:center;align-content:center;gap:6px;text-align:center;min-height:0}
#vis{width:min(100%,82vh,760px);aspect-ratio:1;cursor:pointer;touch-action:manipulation}
.state{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.state.listen{color:var(--teal)}
.said{max-width:52ch;min-height:1.5em;font-size:17px;padding-inline:8px}
.heard{max-width:52ch;min-height:1.3em;color:var(--muted);font-size:14.5px}
.err{color:var(--accent);font-size:14px;max-width:52ch}
.setupbar{border:1px solid var(--accent);border-radius:12px;padding:10px 14px;max-width:520px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.dock{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-block:10px 12px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn.small{padding:8px 12px;font-size:14px;font-weight:500}
#typeForm{display:flex;gap:8px;padding-bottom:10px}
#typeForm input{flex:1}
input[type=text],input[type=password],input[type=number],input[type=url],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:78px}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
/* Blatt (Mehr) */
.sheet{position:fixed;inset:0;background:rgba(6,10,11,.97);z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 10px) max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 30px) max(14px,env(safe-area-inset-left))}
.sheet-in{max-width:760px;margin:0 auto;display:grid;gap:14px}
.sheet-head{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:rgba(6,10,11,.97);padding-block:6px;z-index:2}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
h2{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
h3{font-family:var(--f-display);font-size:15px;font-weight:500;margin:0}
.note{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px}
.pchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--glow)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps label{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.steps input{width:22px;height:22px;accent-color:var(--ok)}
.steps label:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.schip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:none;font-size:14.5px}
.schip.done{background:var(--glow);border-color:var(--accent)}
.field{display:grid;gap:5px}
.field label{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.proto{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.proto summary{cursor:pointer;font-weight:600}
.proto summary span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.proto .t{white-space:pre-wrap;margin-top:8px;font-size:15px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mlist li{display:flex;gap:8px;border-left:2px solid var(--accent);padding:3px 0 3px 10px;font-size:14.5px}
.mlist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.mlist time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.mlist button{background:none;border:0;color:var(--muted)}
.convo{display:grid;gap:6px;max-height:50vh;overflow-y:auto}
.msg{padding:8px 11px;border-radius:11px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.me{justify-self:end;background:var(--glow);border:1px solid var(--accent)}
.msg.ai{justify-self:start;border:1px solid var(--line)}
.prof{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
/* Modale */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.modal-in{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(420px,100%);display:grid;gap:12px}
.modal-in h3{font-size:17px}
.big{font-size:22px;letter-spacing:.3em;text-align:center}
</style>
</head>

<script>
/* Atlas Orb: Varianten (kern, gitter, schwarm), Effekte für den Kern (pur, funken, atmen, hud) und Farbpaletten. */
const ORB_PALETTES={
  glut:{name:"Glut",a:[232,147,90],b:[248,198,150],c:[255,96,48]},
  rotlicht:{name:"Rotlicht",a:[236,64,58],b:[255,160,140],c:[190,20,60]},
  arktis:{name:"Arktis",a:[90,178,255],b:[205,236,255],c:[60,105,255]},
  aurora:{name:"Aurora",a:[64,228,176],b:[196,255,228],c:[70,160,255]},
  plasma:{name:"Plasma",a:[176,98,255],b:[236,196,255],c:[255,72,196]},
  gold:{name:"Gold",a:[232,188,88],b:[255,238,176],c:[214,128,36]},
  spektrum:{name:"Spektrum",dynamic:true}

function mixc(a,b,u){return [0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*u))}

function makeOrb(cv,opt){
  const ctx=cv.getContext("2d");
  const st={mode:"idle",energy:0,variant:(opt&&opt.variant)||"ruhe",palette:(opt&&opt.palette)||"glut",fx:(opt&&opt.fx)||"pur"};
  const fib=n=>{const out=[],ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,r=Math.sqrt(1-y*y),th=ga*i;out.push([Math.cos(th)*r,y,Math.sin(th)*r,Math.random()])}return out};
  const P1=fib(1200),P2=fib(260);
  // Nachbarn für das Gitter einmal vorberechnen
  const EDGES=[];for(let i=0;i<P2.length;i++){const d=[];for(let j=0;j<P2.length;j++)if(j!==i){const dx=P2[i][0]-P2[j][0],dy=P2[i][1]-P2[j][1],dz=P2[i][2]-P2[j][2];d.push([dx*dx+dy*dy+dz*dz,j])}d.sort((x,y)=>x[0]-y[0]);for(let k=0;k<3;k++)if(d[k][1]>i)EDGES.push([i,d[k][1]])}
  // Schwarm: Teilchen auf geneigten Bahnen
  const RINGS=[0,1,2,3,4].map(k=>({inc:0.35+k*0.55,node:k*1.26,r:1.05+k*0.09,spd:(k%2?-1:1)*(0.35+k*0.08),n:110}));
  const SW=[];RINGS.forEach((R,ri)=>{for(let i=0;i<R.n;i++)SW.push({ri,ph:i/R.n*6.283+Math.random()*0.05,j:Math.random()})});
  let rot=0,last=performance.now(),flow=0,flash=0,armed=false,spread=0,open=0,lmix=0,phase=0,prevMode="idle",emitAcc=0,bang=0,nova=0,nameA=1,thinkA=0;const STARS=[];const waves=[];const t0=last;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rgb=c=>c.join(",");
  function colors(t){const p=ORB_PALETTES[st.palette]||ORB_PALETTES.glut;let a,b,c;

    ctx.globalCompositeOperation="lighter";const cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(.35),stl=Math.sin(.35);

    for(let i=0;i<P1.length;i++){const p=P1[i];const n=Math.sin(p[0]*4+t*2.3+p[3]*6)*Math.sin(p[1]*5-t*1.9)*0.6+Math.sin(p[2]*6+t*3.1)*0.4;
      let k=1+amp*n,px0=p[0],py0=p[1],pz0=p[2];
      if(fx==="atmen"){k+=spread*(0.25+1.1*p[3]*p[3]);const sw=spread*1.6*(p[3]-0.5);const cs=Math.cos(sw),sn=Math.sin(sw);const nx=px0*cs-pz0*sn;pz0=px0*sn+pz0*cs;px0=nx}
      const [x,y,d0]=project(px0*k,py0*k,pz0*k,cr,sr,ct,stl),d=Math.max(0,Math.min(1,d0));

      ctx.fillStyle=`rgba(${col},${al})`;ctx.beginPath();ctx.arc(cx+x*R,cy+y*R,S*(0.0016+0.0032*d)*(1+E*0.7)*(spark?2.4:1+fl*0.6),0,6.283);ctx.fill()}

    ctx.lineWidth=Math.max(1,S*0.0028);
    if(fx!=="hud"){
      for(let i=0;i<2;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*(i?-0.18:0.13)+i*1.2);ctx.scale(1,0.26+i*0.12);ctx.beginPath();ctx.arc(0,0,R*(1.34+i*0.13),0,6.283);ctx.restore();ctx.strokeStyle=`rgba(${i?c:b},${0.2+0.3*E+0.4*fl})`;ctx.stroke()}
      ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*0.08);for(let i=0;i<90;i++){ctx.rotate(6.283/90);const mj=i%9===0,L=R*(0.03+(mj?0.05:0)+E*0.1*Math.abs(Math.sin(i*1.7+t*7)));ctx.fillStyle=`rgba(${a},${mj?0.75:0.32})`;ctx.fillRect(R*1.6,-S*0.0012,L,S*0.0024)}ctx.restore();

  function hud(t,S,cx,cy,R,a,b,c,E,fl){

    ctx.fillText(lbl,cx,cy+R*2.28);ctx.fillStyle=`rgba(${a},0.5)`;ctx.fillText((st.label||"ATLAS")+" · "+new Date().toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),cx,cy-R*2.2)}
  function ruhe(t,dt,W,H,S,cx,cy){
    // Ruhige Kugel: geordnete Punkte, langsame Drehung, sanftes Öffnen und Schließen beim Sprechen. Kein Flackern.

    if(nameA>0.02){const txt=(st.label||"ATLAS").toUpperCase(),fs=Math.round(S*0.05),sp=fs*0.3;
      ctx.font=`600 ${fs}px "Unbounded","Arial Black",system-ui,sans-serif`;ctx.textBaseline="middle";ctx.textAlign="left";
      const ws=[...txt].map(ch=>ctx.measureText(ch).width),tw=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
      const hg=ctx.createRadialGradient(cx,cy,0,cx,cy,tw*0.9);hg.addColorStop(0,`rgba(${mid},${0.3*nameA})`);hg.addColorStop(1,`rgba(${mid},0)`);ctx.fillStyle=hg;ctx.beginPath();ctx.arc(cx,cy,tw*0.9,0,6.283);ctx.fill();
      ctx.shadowColor=`rgba(${mid},0.9)`;ctx.shadowBlur=S*0.02;ctx.fillStyle=`rgba(255,252,246,${0.95*nameA})`;
      let x=cx-tw/2;[...txt].forEach((ch,i)=>{ctx.fillText(ch,x,cy+fs*0.04);x+=ws[i]+sp});ctx.shadowBlur=0}}
  function gitter(t,dt,W,H,S,cx,cy){
    const {a,b,c}=colors(t),E=st.energy;rot+=dt*(st.mode==="think"?1.6:st.mode==="speak"?0.6:0.18);
    const R=S*0.28*(st.mode==="idle"?1+0.02*Math.sin(t*1.2):1);glow(cx,cy,R,c,E*0.8,W,H);
    const cr=Math.cos(rot),sr=Math.sin(rot),tl=0.4+0.1*Math.sin(t*0.3),ct=Math.cos(tl),stl=Math.sin(tl);
    const amp=st.mode==="speak"?0.04+0.2*E:0.02;
    const pr=P2.map(p=>{const n=Math.sin(p[1]*6-t*3+p[3]*4),k=1+amp*n;const q=project(p[0]*k,p[1]*k,p[2]*k,cr,sr,ct,stl);return [cx+q[0]*R,cy+q[1]*R,q[2]]});
    ctx.globalCompositeOperation="lighter";ctx.lineWidth=Math.max(1,S*0.0022);
    const pulse=(t*0.6)%1;
    for(const [i,j] of EDGES){const A=pr[i],B=pr[j],d=(A[2]+B[2])/2;const lat=(P2[i][1]+1)/2;const hot=Math.max(0,1-Math.abs(lat-pulse)*6);
      ctx.strokeStyle=`rgba(${hot>0.2?b:a},${(0.06+0.5*d)*(0.6+0.4*hot+0.5*E)})`;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}
    for(let i=0;i<pr.length;i++){const q=pr[i],d=q[2];ctx.fillStyle=`rgba(${P2[i][3]>0.85?c:b},${0.2+0.8*d})`;ctx.beginPath();ctx.arc(q[0],q[1],S*(0.002+0.004*d)*(1+E),0,6.283);ctx.fill()}
    // Satelliten auf Bahnen
    for(let k=0;k<3;k++){const inc=0.5+k*0.7,ang=t*(0.9+k*0.35)+k*2,rr=1.42+k*0.08;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(inc);ctx.scale(1,0.3);ctx.beginPath();ctx.arc(0,0,R*rr,0,6.283);ctx.restore();ctx.strokeStyle=`rgba(${a},${0.12+0.15*E})`;ctx.stroke();
      const x=Math.cos(ang)*R*rr,y=Math.sin(ang)*R*rr*0.3,px=cx+x*Math.cos(inc)-y*Math.sin(inc),py=cy+x*Math.sin(inc)+y*Math.cos(inc);
      const g=ctx.createRadialGradient(px,py,0,px,py,S*0.025);g.addColorStop(0,`rgba(${b},0.95)`);g.addColorStop(1,`rgba(${b},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,S*0.025,0,6.283);ctx.fill()}
    // HUD-Segmente
    ctx.globalCompositeOperation="source-over";ctx.lineCap="butt";
    for(let k=0;k<2;k++){const rr=R*(1.7+k*0.1),seg=k?12:6;ctx.lineWidth=S*(k?0.004:0.008);
      for(let i=0;i<seg;i++){const s0=i/seg*6.283+t*(k?-0.25:0.15),len=6.283/seg*(k?0.55:0.7)*(0.8+0.4*E*Math.abs(Math.sin(i+t*4)));ctx.beginPath();ctx.arc(cx,cy,rr,s0,s0+len);ctx.strokeStyle=`rgba(${k?c:a},${k?0.35:0.55})`;ctx.stroke()}}
    thinkArc(cx,cy,R,b,t,S);core(cx,cy,R,a,b,E,0.8)}
  function schwarm(t,dt,W,H,S,cx,cy){
    const {a,b,c}=colors(t),E=st.energy;const sp=st.mode==="think"?2.2:st.mode==="speak"?1.2+E:st.mode==="listen"?0.8:0.45;flow+=dt*sp;
    const R=S*0.31;
    ctx.globalCompositeOperation="lighter";
    for(const q of SW){const ring=RINGS[q.ri],ph=q.ph+flow*ring.spd,wob=1+(st.mode==="speak"?0.18*E*Math.sin(ph*5+t*8+q.j*6):0.03*Math.sin(ph*3+t));
      let x=Math.cos(ph)*ring.r*wob,y=0,z=Math.sin(ph)*ring.r*wob;
      const ci=Math.cos(ring.inc),si=Math.sin(ring.inc);let y1=y*ci-z*si,z1=y*si+z*ci;
      const cn=Math.cos(ring.node+t*0.05),sn=Math.sin(ring.node+t*0.05);const x2=x*cn-z1*sn,z2=x*sn+z1*cn;
      const pr=1/(1.9-z2*0.5),d=(z2/1.5+1)/2;
      ctx.fillStyle=`rgba(${q.j>0.85?b:q.ri%2?c:a},${0.1+0.5*d})`;ctx.beginPath();ctx.arc(cx+x2*R*pr*1.2,cy+y1*R*pr*1.2,S*(0.0018+0.003*d)*(1+E*0.6),0,6.283);ctx.fill()}
    // pulsierender Kern mit Wellen
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.9);g.addColorStop(0,`rgba(${b},${0.18+0.3*E})`);g.addColorStop(1,`rgba(${a},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*0.9,0,6.283);ctx.fill();
    ctx.globalCompositeOperation="source-over";
    for(let k=0;k<3;k++){const ph=((t*(0.5+E))+k/3)%1;ctx.beginPath();ctx.arc(cx,cy,R*(0.3+ph*1.4),0,6.283);ctx.strokeStyle=`rgba(${a},${(1-ph)*(0.25+0.4*E)})`;ctx.lineWidth=S*0.003;ctx.stroke()}
    thinkArc(cx,cy,R,b,t,S);core(cx,cy,R,a,b,E,0.8)}
  requestAnimationFrame(frame);
  return st;
}

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P="atlas2:";
const ls={
  get(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true}catch{showErr("Speicher am Gerät ist voll. Bitte im Tresor ein Backup machen.");return false}},
  del(k){try{localStorage.removeItem(P+k)}catch{}},
  keys(pre){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(P+pre))out.push(k.slice(P.length))}}catch{}return out.sort()}
};
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hhmm=(d=new Date())=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const fmtDay=d=>new Date(d+"T12:00:00").toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
const pick=a=>a[Math.floor(Math.random()*a.length)];
let today=dayKey();
const SESSION=Date.now().toString(36);
function showErr(m){$("err").textContent=m||"";$("err").hidden=!m}

/* ================= Einstellungen & Profile ================= */
const S=Object.assign({key:"",model:"claude-sonnet-5-5",aname:"Atlas",voice:"",rate:1,orb:"ruhe",palette:"spektrum",fx:"supernova",cool:20,sens:5,lockHours:16,noSearch:false},ls.get("settings",{}));
const saveSettings=()=>ls.set("settings",S);
const TYP={haupt:"Hauptnutzer",erwachsen:"Erwachsen",kind:"Kind",gast:"Gast"};
const DEFAULT_PROFILES=[
  {id:"haupt",name:"Mario",typ:"haupt",info:"",routine:["Elektrolyte","Eisbad","Aufwärmen","Rotlicht","Training"],supps:[],notes:[]}
];
let profiles=ls.get("profiles",null)||JSON.parse(JSON.stringify(DEFAULT_PROFILES));
const saveProfiles=()=>ls.set("profiles",profiles);
const main=()=>profiles.find(p=>p.typ==="haupt")||profiles[0];
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").trim();
function findProfile(name){const n=norm(name);if(!n)return null;return profiles.find(p=>norm(p.name)===n)||profiles.find(p=>n.split(" ").includes(norm(p.name)))||profiles.find(p=>norm(p.name).startsWith(n)&&n.length>=3)||null}
let cur=main();
const isMain=()=>cur.typ==="haupt";
function setPerson(name){
  const p=findProfile(name);const prev=cur;
  cur=p||{id:"gast-"+norm(name).replace(/ /g,"-"),name:String(name||"Gast").trim()||"Gast",typ:"gast",info:"",routine:[],supps:[],notes:[]};
  if(prev.typ==="haupt"&&cur.typ!=="haupt"&&privKey)lockVault();
  renderPerson();if(!$("sheet").hidden)renderPane();return cur}
function renderPerson(){const c=$("personChip");c.textContent=cur.name;c.classList.toggle("kind",cur.typ==="kind")}

/* Tagesstand je Person */
const dayOf=p=>ls.get(`day:${today}:${p.id}`,{routine:[],supps:[]});
const setDay=(p,d)=>{ls.set(`day:${today}:${p.id}`,d);if(!$("sheet").hidden&&pane==="heute")renderPane()};
const statusOf=p=>{const d=dayOf(p);return {routine:p.routine.map(s=>({schritt:s,erledigt:d.routine.includes(s)})),supplements:p.supps.map(s=>({name:s,genommen:d.supps.includes(s)}))}};

/* ================= Tresor (Verschlüsselung) ================= */
/* Öffentlicher Schlüssel verschlüsselt jederzeit, nur mit dem Code lässt sich lesen. */
const te=new TextEncoder(),td=new TextDecoder();
const toB64=buf=>{const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const RSA={name:"RSA-OAEP",hash:"SHA-256"};
let pubKey=null,privKey=null,unlockedAt=0,bridge=null,mem={notes:[],protos:{}};
const vault=()=>ls.get("vault",null);
async function kek(code,salt,iter){const base=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function createVault(code){
  const kp=await crypto.subtle.generateKey({...RSA,modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,["encrypt","decrypt"]);
  const spki=await crypto.subtle.exportKey("spki",kp.publicKey),pk8=await crypto.subtle.exportKey("pkcs8",kp.privateKey);
  const salt=rnd(16),iv=rnd(12),iter=310000,k=await kek(code,salt,iter);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,pk8);
  ls.set("vault",{v:1,iter,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct),pub:toB64(spki)});
  pubKey=kp.publicKey;privKey=kp.privateKey;unlockedAt=Date.now();mem={notes:[],protos:{}};
  if(log.length)persistLog();renderLock()}
async function getPub(){if(pubKey)return pubKey;const v=vault();if(!v)return null;pubKey=await crypto.subtle.importKey("spki",fromB64(v.pub),RSA,false,["encrypt"]);return pubKey}
async function unlockVault(code){
  const v=vault();if(!v)return false;const k=await kek(code,fromB64(v.salt),v.iter);let pk8;
  try{pk8=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(v.iv)},k,fromB64(v.ct))}catch{return false}
  privKey=await crypto.subtle.importKey("pkcs8",pk8,RSA,true,["decrypt"]);unlockedAt=Date.now();
  await loadMemory();renderLock();consolidate();return true}
async function changeCode(code){const v=vault(),pk8=await crypto.subtle.exportKey("pkcs8",privKey),salt=rnd(16),iv=rnd(12),k=await kek(code,salt,v.iter);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,pk8);ls.set("vault",{...v,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)})}
function lockVault(){privKey=null;bridge=null;mem={notes:[],protos:{}};renderLock();if(!$("sheet").hidden&&pane!=="heute")renderPane()}
async function seal(obj){const pk=await getPub();if(!pk)return null;
  const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]),raw=await crypto.subtle.exportKey("raw",aes);
  const ek=await crypto.subtle.encrypt(RSA,pk,raw),iv=rnd(12),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,te.encode(JSON.stringify(obj)));
  return {ek:toB64(ek),iv:toB64(iv),ct:toB64(ct)}}
async function unseal(s){if(!privKey||!s||!s.ek)return null;try{const raw=await crypto.subtle.decrypt(RSA,privKey,fromB64(s.ek));const aes=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(s.iv)},aes,fromB64(s.ct))))}catch{return null}}
async function putSealed(k,obj){const s=await seal(obj);return s?ls.set(k,s):false}
async function loadMemory(){
  const m={notes:[],protos:{}};
  for(const k of ls.keys("note:")){const n=await unseal(ls.get(k));if(n)m.notes.push({...n,k})}
  m.notes.sort((a,b)=>a.zeit<b.zeit?-1:1);
  for(const k of ls.keys("proto:")){const [,d,sid]=k.split(":");const p=await unseal(ls.get(k));if(p)(m.protos[d]=m.protos[d]||[]).push({sid,...p})}
  const b=await unseal(ls.get("bridge",null));bridge=b&&b.url?b:null;mem=m}
function renderLock(){const b=$("lockBtn");b.textContent=privKey?"🔓":"🔒";b.classList.toggle("open",!!privKey);b.setAttribute("aria-label",privKey?"Tresor offen":"Tresor gesperrt");renderSetupBar()}

/* Code-Eingabe */
let codeMode="unlock",codeAfter=null,fails=0,blockUntil=0;
function askCode(after,mode){if(away)return;codeAfter=after||null;codeMode=mode||(vault()?"unlock":"create");
  const create=codeMode!=="unlock";$("codeTitle").textContent=codeMode==="create"?"Tresor-Code festlegen":codeMode==="change"?"Neuen Code festlegen":"Code eingeben";
  $("codeNote").textContent=codeMode==="create"?"Mit diesem Code schützt du Protokolle, Notizen, Kalender und Mails. Mindestens 6 Zeichen. Gut merken: Ohne Code sind die Daten nicht lesbar, auch nicht für mich.":codeMode==="change"?"Mindestens 6 Zeichen.":"Dein Gedächtnis-Tresor ist gesperrt.";
  $("codeIn2").hidden=!create;$("codeIn").value=$("codeIn2").value="";$("codeErr").hidden=true;$("codeOk").textContent=create?"Festlegen":"Öffnen";
  $("codeModal").hidden=false;setTimeout(()=>$("codeIn").focus(),50)}
$("codeCancel").onclick=()=>{$("codeModal").hidden=true;codeAfter=null};
$("codeForm").onsubmit=async e=>{e.preventDefault();const c=$("codeIn").value,err=m=>{$("codeErr").textContent=m;$("codeErr").hidden=false};
  if(codeMode!=="unlock"){if(c.length<6)return err("Mindestens 6 Zeichen.");if(c!==$("codeIn2").value)return err("Die beiden Eingaben sind nicht gleich.");
    $("codeOk").disabled=true;try{codeMode==="create"?await createVault(c):await changeCode(c)}catch{$("codeOk").disabled=false;return err("Verschlüsselung geht hier nicht. Bitte über eine https-Adresse öffnen.")}$("codeOk").disabled=false;
    $("codeModal").hidden=true;if(!$("sheet").hidden)renderPane();return}
  if(Date.now()<blockUntil)return err("Zu viele Versuche. Bitte eine Minute warten.");
  $("codeOk").disabled=true;let ok=false;try{ok=await unlockVault(c)}catch{}$("codeOk").disabled=false;
  if(!ok){fails++;if(fails>=5){blockUntil=Date.now()+60000;fails=0}return err("Falscher Code.")}
  fails=0;$("codeModal").hidden=true;if(!$("sheet").hidden)renderPane();
  const a=codeAfter;codeAfter=null;
  if(a==="briefing")whenIdle(()=>converse("(System: Code korrekt, der Tresor ist offen. Mach jetzt das Briefing.)",{internal:true,maxTokens:1600}));
  else if(a==="verlauf")whenIdle(()=>converse("(System: Code korrekt, der Tresor ist offen. Beantworte jetzt meine letzte Frage, nutze verlauf_suchen.)",{internal:true}));
  else if(a&&a.startsWith("sheet"))openSheet(a.split(":")[1]||"heute")};
$("lockBtn").onclick=()=>{if(privKey){lockVault();say("Tresor gesperrt.")}else if(!isMain()){showErr("Der Tresor gehört "+main().name+".")}else askCode("sheet")};

/* ================= Gespräch, Protokolle, Gedächtnis ================= */
let log=[];  // nur im Arbeitsspeicher, verschlüsselt gesichert
let persistChain=Promise.resolve();
function addLog(rolle,text){log.push({rolle,person:cur.name,text,zeit:new Date().toISOString(),uhr:hhmm()});persistLog();if(!$("sheet").hidden&&pane==="tresor")renderPane()}
function persistLog(){persistChain=persistChain.then(()=>putSealed(`log:${today}:${SESSION}`,log)).catch(()=>{})}
const PROTO=d=>`Schreib ein Tagesprotokoll für ${fmtDay(d)} aus dem Gespräch unten. Es dient ${main().name} zum Nachblättern, falls er etwas vergisst.
Abschnitte mit Überschrift in Großbuchstaben, darunter Stichpunkte mit „– “. Leere Abschnitte weglassen:
WER WAR DA
THEMEN
ENTSCHEIDUNGEN
OFFENE PUNKTE / TO-DOS
ROUTINE & SUPPLEMENTS
STIMMUNG & ENERGIE
Nur was wirklich gesagt wurde, nichts erfinden. Knapp, höchstens 220 Wörter, kein Markdown außer den Strichen.

GESPRÄCH:
`;
const transcript=L=>L.filter(m=>m.rolle!=="intern").map(m=>`${m.uhr||""} ${m.rolle==="assistent"?S.aname+" (zu "+m.person+")":m.person}: ${m.text}`).join("\n").slice(-60000);
async function summarize(d,L){const tr=transcript(L);if(!tr.trim()||!S.key)return null;const res=await api({model:S.model,max_tokens:1000,messages:[{role:"user",content:PROTO(d)+tr}]});return textOf(res).trim()||null}
async function saveProto(d,sid,text){const p={text,aktualisiert:new Date().toISOString()};await putSealed(`proto:${d}:${sid}`,p);if(privKey){const arr=(mem.protos[d]=mem.protos[d]||[]).filter(x=>x.sid!==sid);arr.push({sid,...p});mem.protos[d]=arr}}
let protoTimer=null,protoLen=0,protoBusy=false;
function scheduleProto(){clearTimeout(protoTimer);protoTimer=setTimeout(sessionProto,3*60000)}
async function sessionProto(){if(protoBusy||!vault())return;const n=log.filter(m=>m.rolle==="mensch").length;if(!n||log.length===protoLen)return;protoBusy=true;
  try{const t=await summarize(today,log);if(t){await saveProto(today,SESSION,t);protoLen=log.length;if(!$("sheet").hidden&&pane==="tresor")renderPane()}}catch{}finally{protoBusy=false}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(protoTimer);sessionProto()}});
async function consolidate(){ // vergangene Tage zu einem Protokoll zusammenführen, Rohmitschrift löschen
  if(!privKey||!S.key)return;
  const dates=new Set([...ls.keys("log:"),...ls.keys("proto:")].map(k=>k.split(":")[1]).filter(d=>d<today));
  for(const d of [...dates].sort()){
    try{
      if(!ls.get(`proto:${d}:tag`,null)){
        for(const k of ls.keys(`log:${d}:`)){const sid=k.split(":")[2];if(!ls.get(`proto:${d}:${sid}`,null)){const L=await unseal(ls.get(k));if(L){const t=await summarize(d,L);if(t)await saveProto(d,sid,t)}}}
        const sess=(mem.protos[d]||[]).filter(x=>x.sid!=="tag").sort((a,b)=>a.aktualisiert<b.aktualisiert?-1:1);
        let final=null;
        if(sess.length===1)final=sess[0].text;
        else if(sess.length>1){const res=await api({model:S.model,max_tokens:1000,messages:[{role:"user",content:`Führe diese Teilprotokolle vom ${fmtDay(d)} zu EINEM Tagesprotokoll zusammen. Gleiches Format (Überschriften in Großbuchstaben, Stichpunkte mit „– “), Doppeltes streichen, nichts erfinden, höchstens 250 Wörter.\n\n`+sess.map(s=>s.text).join("\n\n---\n\n")}]});final=textOf(res).trim()}
        if(!final)continue;await saveProto(d,"tag",final)}
      for(const k of ls.keys(`log:${d}:`))ls.del(k);
      for(const k of ls.keys(`proto:${d}:`))if(!k.endsWith(":tag"))ls.del(k);
      if(mem.protos[d])mem.protos[d]=mem.protos[d].filter(x=>x.sid==="tag");
    }catch{}
  }
}
async function addNote(text){const t=String(text||"").trim();if(!t)return "leer";const n={text:t,zeit:new Date().toISOString()};
  if(isMain()){if(!vault())return "Kein Tresor eingerichtet, Notiz nicht gespeichert.";const k="note:"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await putSealed(k,n);if(privKey)mem.notes.push({...n,k});return "Gemerkt (im Tresor)."}
  (cur.notes=cur.notes||[]).push(n);if(cur.typ!=="gast")saveProfiles();return "Gemerkt."}

/* ================= Erscheinung ================= */
const vis=makeOrb($("vis"),{variant:S.orb,palette:S.palette,fx:S.fx});vis.label=S.aname.toUpperCase();
function setMode(m,label){vis.mode=m;const s=$("state");s.textContent=label;s.classList.toggle("listen",m==="listen")}
const idleLabel=()=>away?"Abwesenheitsmodus":stream?"Raum-Modus · wartet":"Bereit · Kugel antippen";

/* ================= Stimme ================= */
const TTS="speechSynthesis" in window;let voices=[];
function loadVoices(){if(!TTS)return;voices=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));const sc=v=>(/premium|enhanced|erweitert|siri|neural/i.test(v.name)?10:0)+(/anna|helena|petra|markus|viktor|yannick/i.test(v.name)?2:0);voices.sort((a,b)=>sc(b)-sc(a))}
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const voice=()=>voices.find(v=>v.name===S.voice)||voices[0]||null;
let pending=0,afterSpeak=null,gen=0;
const clean=s=>String(s).replace(/https?:\/\/\S+/g,"").replace(/\[[^\]]*\]\([^)]*\)/g,"").replace(/[*#_`>•|]/g,"").replace(/\s+/g," ").trim();
function speak(text,then){text=clean(text);$("said").textContent=text;if(!TTS||!text){setMode("idle",idleLabel());then&&then();return}
  const my=++gen;speechSynthesis.cancel();const parts=text.match(/[^.!?…]+[.!?…]*\s*/g)||[text];afterSpeak=then||null;pending=parts.length;let started=false;
  const finish=()=>{if(my!==gen||pending<0)return;pending=0;setMode("idle",idleLabel());const f=afterSpeak;afterSpeak=null;f&&f()};
  // Chrome verschluckt Sprache direkt nach cancel(): kurz warten, dann sprechen
  setTimeout(()=>{if(my!==gen)return;try{speechSynthesis.resume()}catch{}
    for(const p of parts){const u=new SpeechSynthesisUtterance(p.trim());u.lang="de-DE";const v=voice();if(v)u.voice=v;u.rate=S.rate;
      u.onstart=()=>{if(my!==gen)return;started=true;setMode("speak","Spricht");vis.energy=Math.max(vis.energy,.6)};u.onboundary=()=>{vis.energy=Math.min(1,vis.energy+.45)};
      u.onend=u.onerror=()=>{if(my!==gen)return;if(--pending<=0)finish()};speechSynthesis.speak(u)}},150);
  // Absicherung: startet die Stimme nicht, geht es trotzdem weiter (Text steht ja da)
  setTimeout(()=>{if(my===gen&&!started&&pending>0){if(!soundWarned){soundWarned=true;showErr("Die Stimme startet hier nicht. Lautstärke am Gerät prüfen. Am Mac: Systemeinstellungen → Ton, richtiger Ausgang gewählt?")}finish()}},3000);
  // Notbremse, falls das Ende nie gemeldet wird
  setTimeout(()=>{if(my===gen&&pending>0)finish()},4000+text.length*90/Math.max(.5,S.rate))}
let soundWarned=false;
const say=t=>speak(t);
function hush(){gen++;afterSpeak=null;pending=0;if(TTS)speechSynthesis.cancel()}
function unlockAudio(){if(TTS){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}
const speaking=()=>TTS&&(speechSynthesis.speaking||pending>0);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,convo=false,recActive=false,ignoreUntil=0,lastHeard=0;
/* Durchgehendes Zuhören: einmal antippen, dann bleibt das Mikrofon im Gespräch offen. Während Atlas spricht, wird nichts ausgewertet. */
function ensureRec(){if(!SR||away)return false;if(recActive)return true;
  rec=new SR();rec.lang="de-DE";rec.continuous=true;rec.interimResults=true;
  rec.onstart=()=>{recActive=true};
  rec.onresult=e=>{if(!convo||busy||speaking()||Date.now()<ignoreUntil)return;let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const t=r[0].transcript.trim();if(t){lastHeard=Date.now();$("heard").textContent=t;handleUtterance(t)}}else interim+=r[0].transcript}
    if(interim){lastHeard=Date.now();$("heard").textContent=interim;vis.energy=Math.min(1,vis.energy+.3)}};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){convo=false;listening=false;showErr("Mikrofon oder Spracherkennung ist nicht erlaubt. iPhone-Einstellungen → Safari → Mikrofon erlauben, und unter Siri das Diktieren einschalten.")}};
  rec.onend=()=>{recActive=false;if((convo||stream)&&!away)setTimeout(()=>{if(recActive||away)return;try{rec.start()}catch{if(convo){listening=false;convo=false;setMode("idle","Kugel antippen zum Weitersprechen")}}},300)};
  try{rec.start();return true}catch{return false}}
function listen(){if(!SR){showErr("Spracheingabe gibt es hier nicht. Bitte Safari (iPad) oder Chrome verwenden.");return}
  if(busy)return;convo=true;listening=true;lastHeard=Date.now();ensureRec();setMode("listen","Hört zu");if(!$("heard").textContent)$("heard").textContent="…"}
function endConvo(label){convo=false;listening=false;$("heard").textContent="";setMode("idle",label||idleLabel())}
setInterval(()=>{if(convo&&!busy&&!speaking()&&Date.now()-lastHeard>60000)endConvo()},5000);
function handleUtterance(t){$("heard").textContent=t;
  if(/^(stopp?|danke,? das war'?s|tschüss|ende)\b/i.test(t)){convo=false;listening=false;speak(pick(["Alles klar.","Gern. Bis später.","Passt, ich bin da, wenn du mich brauchst."]));addLog("mensch",t);return}
  const brief=/briefing/i.test(t);if(brief&&isMain())speak("Alles klar, ich hol mir deinen Tag.");
  listening=false;converse(t,{maxTokens:brief?1600:700})}
function stopAll(){convo=false;listening=false;try{rec&&rec.abort()}catch{}hush();abortCtl?.abort();busy=false;setMode("idle",idleLabel())}

const match=(a,b)=>{a=norm(a);b=norm(b);return !!a&&!!b&&(a.includes(b)||b.includes(a))};
async function runTool(name,inp){

  case "merken":return addNote(inp.text);
  case "abhaken":{if(cur.typ!=="haupt"&&cur.typ!=="erwachsen")return "Nicht verfügbar.";const d=dayOf(cur),on=inp.erledigt!==false;

    if(!r&&!sp)return "Nicht in der Liste: "+inp.name+". Stand: "+JSON.stringify(statusOf(cur));
    const key=r?"routine":"supps",val=r||sp;d[key]=on?[...new Set([...d[key],val])]:d[key].filter(x=>x!==val);setDay(cur,d);return JSON.stringify(statusOf(cur))}
  case "liste_aendern":{let p=cur;if(inp.person){const q=findProfile(inp.person);if(!q)return "Person unbekannt: "+inp.person;if(q!==cur&&!isMain())return "Nicht erlaubt.";p=q}
    if(p.typ==="kind"||p.typ==="gast")return "Für "+p.name+" gibt es keine Listen.";const key=inp.liste==="routine"?"routine":"supps";
    const rm=(inp.entfernen||[]).map(String),add=(inp.hinzufuegen||[]).map(s=>String(s).trim()).filter(Boolean);
    p[key]=p[key].filter(x=>!rm.some(r=>match(x,r)));for(const a of add)if(!p[key].some(x=>norm(x)===norm(a)))p[key].push(a);
    saveProfiles();if(!$("sheet").hidden)renderPane();return JSON.stringify({person:p.name,liste:inp.liste,neu:p[key]})}
  case "verlauf_suchen":{if(!isMain())return "Nicht erlaubt.";if(!privKey){askCode("verlauf");return "GESPERRT: Die Code-Eingabe ist jetzt am Bildschirm offen. Bitte ihn kurz, den Code einzutippen."}
    const q=norm(inp.stichwort),words=q.split(" ").filter(w=>w.length>2),hit=t=>{t=norm(t);return t.includes(q)||words.some(w=>t.includes(w))};
    const protos=Object.keys(mem.protos).sort().reverse().flatMap(d=>mem.protos[d].filter(p=>hit(p.text)).map(p=>({datum:d,protokoll:p.text}))).slice(0,8);
    return JSON.stringify({protokolle:protos,notizen:mem.notes.filter(n=>hit(n.text)).map(n=>({datum:n.zeit.slice(0,10),text:n.text})),heute:log.filter(m=>m.rolle!=="intern"&&hit(m.text)).slice(-8).map(m=>m.person+": "+m.text)})}
  case "person_anlegen":{if(!isMain())return "Nicht erlaubt.";const n=String(inp.name||"").trim();if(!n)return "Kein Name.";if(findProfile(n))return n+" ist schon bekannt.";
    const typ=inp.art==="kind"?"kind":"erwachsen";profiles.push({id:"p"+Date.now().toString(36),name:n,typ,info:String(inp.info||"").trim(),routine:typ==="kind"?[]:["Supplements","Rotlicht","Eisbad"],supps:[],notes:[]});saveProfiles();return `${n} ist angelegt (${TYP[typ]}).`}
  case "abwesenheit_starten":{if(!isMain())return "Nicht erlaubt.";if(!voiceCode())return "Es ist noch kein Sprachcode eingerichtet. Sag Mario, er soll ihn im Tresor unter Abwesenheitsmodus festlegen.";setTimeout(startAway,2500);return "Abwesenheitsmodus startet gleich nach deiner Antwort. Verabschiede dich kurz."}

    if(!bridge)return JSON.stringify({hinweis:"Kalender- und Mail-Verbindung ist noch nicht eingerichtet. Mach das Briefing mit Routine, Supplements und Studien-Update und sag kurz, dass Kalender und Mails noch fehlen."});
    try{const r=await fetch(bridge.url+(bridge.url.includes("?")?"&":"?")+"t="+encodeURIComponent(bridge.token));const j=await r.json();if(j.error)return "Kalender-Verbindung abgelehnt: Geheimwort stimmt nicht.";return JSON.stringify(j).slice(0,14000)}

const nowStr=()=>new Date().toLocaleString("de-AT",{dateStyle:"full",timeStyle:"short"});

Personen im Haus: ${profiles.map(p=>p.name+" ("+TYP[p.typ]+")").join(", ")}. Sagt jemand, wer er ist, oder dass er nicht der Begrüßte ist, nutze sofort person_wechseln und sprich ihn mit Namen an.`}

  if(p.typ==="erwachsen")return persona()+`
Du sprichst mit ${p.name}${p.info?" ("+p.info+")":""}. ${M.name} hat für ${p.name} eine Routine und Supplements hergerichtet. Nach der Begrüßung frag, wie es geht, und geh dann kurz durch, was heute noch offen ist: zuerst die Supplements (nenn sie beim Namen), dann Rotlicht und Eisbad. Hake Erledigtes mit „abhaken“ ab, ändere Listen mit „liste_aendern“, wenn ${p.name} das sagt. Hilf auch bei allem anderen (Biohacking, Ernährung, Ideen), für Aktuelles gern mit der Websuche.

Gemerkt über ${p.name}: ${notesOf(p)}

  if(p.typ==="gast")return persona()+`

${recent.slice(-9000)||"keine"}

Du sprichst mit ${M.name}, deinem Hauptnutzer.${M.info?" Über ihn: "+M.info:""} Er bleibt meist nur kurz im Raum: warm, direkt, knapp, trockener Humor, kein Gerede. Wenn er Personen anlegen will (Familie, Mitarbeiter), nutze person_anlegen.

const cleanKey=k=>String(k||"").replace(/[^\x21-\x7E]/g,"");

const textOf=res=>(res.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
function historyMsgs(){
  const src=isMain()?log:log.filter(m=>m.person===cur.name);
  const hist=src.slice(-26).map(m=>({role:m.rolle==="assistent"?"assistant":"user",content:(m.rolle==="mensch"&&isMain()&&m.person!==cur.name?`[${m.person}] `:"")+m.text}));
  while(hist.length&&hist[0].role!=="user")hist.shift();
  const out=[];for(const m of hist){const l=out[out.length-1];if(l&&l.role===m.role)l.content+="\n"+m.content;else out.push({...m})}return out}
let abortCtl=null,busy=false;
function whenIdle(fn){const tick=()=>{if(!busy&&!speaking()&&!listening)fn();else setTimeout(tick,300)};setTimeout(tick,200)}
async function converse(text,{internal=false,maxTokens=700}={}){
  if(away)return;

    for(let round=0;round<8;round++){

      catch(e){if(e.status===400&&/web_search/i.test(e.message)&&tools.includes(WEB)){S.noSearch=true;saveSettings();tools.splice(tools.indexOf(WEB),1);continue}throw e}
      answer+=" "+textOf(res);

      const results=[];for(const b of res.content)if(b.type==="tool_use")results.push({type:"tool_result",tool_use_id:b.id,content:String(await runTool(b.name,b.input||{}))});

    const m=e.message||"";showErr(e.status===401?"API-Schlüssel ist ungültig. Bitte unter Mehr → Einstellungen prüfen.":e.status===429?"Zu viele Anfragen oder Limit erreicht. Kurz warten.":/credit|balance/i.test(m)?"Kein Guthaben mehr im Anthropic-Konto.":e.status===404?"Modell nicht gefunden. Unter Einstellungen ein anderes wählen.":e.status===529||e.status===503?"Claude ist gerade überlastet. Gleich nochmal.":e.status?("Fehler "+e.status+": "+m.slice(0,160)):("Keine Verbindung zu Claude ("+(e.message||e.name||"unbekannt")+"). Unter Mehr → Einstellungen → „Claude testen“ prüfen."))}}

  if(prevFrame){let ch=0;const th=40-S.sens*3;for(let i=0;i<g.length;i++)if(Math.abs(g[i]-prevFrame[i])>th)ch++;

function backupCard(){return `<section class="card"><h2>Backup</h2><div class="note">Das Backup ist verschlüsselt und nur mit deinem Code lesbar. Leg es z. B. in iCloud Drive ab. Der API-Schlüssel ist nicht enthalten.</div>

function wireBackup(){
  $("bx").onclick=async()=>{const data={};for(const k of ls.keys(""))data[k]=ls.get(k);if(data.settings)data.settings={...data.settings,key:""};
    const json=JSON.stringify({format:"atlas-backup",version:2,exportiert:new Date().toISOString(),data});
    const file=new File([json],`atlas-backup-${today}.json`,{type:"application/json"});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Atlas Backup"});$("bm").textContent="Backup übergeben.";return}}catch(e){if(e.name==="AbortError")return}

  const sv=$("sVoice");if(!voices.length)sv.innerHTML="<option value=''>Keine deutsche Stimme gefunden</option>";voices.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=`${v.name} (${v.lang})`;sv.append(o)});sv.value=voice()?.name||"";
  if(privKey){$("bUrl").value=bridge?.url||"";$("bTok").value=bridge?.token||"";
    $("bTest").onclick=async()=>{$("bRes").textContent="Teste…";try{const u=$("bUrl").value.trim(),t=$("bTok").value;const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+encodeURIComponent(t));const j=await r.json();$("bRes").textContent=j.error?"Geheimwort stimmt nicht.":`Klappt: ${j.termine?.length||0} Termine, ${j.mails?.length||0} Mails.`}catch{$("bRes").textContent="Keine Verbindung. Adresse prüfen."}}}
  $("kTest").onclick=async()=>{const k=cleanKey($("sKey").value);$("kRes").textContent="Teste…";
    if(!k.startsWith("sk-ant-")){$("kRes").textContent="Der Schlüssel muss mit sk-ant- beginnen. Bitte neu einfügen.";return}
    try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:$("sModel").value,max_tokens:20,messages:[{role:"user",content:"Sag nur: Verbindung steht."}]})});
      const t=await r.text();if(r.ok){$("kRes").textContent="Klappt: "+(JSON.parse(t).content?.[0]?.text||"ok")}else $("kRes").textContent="Fehler "+r.status+": "+t.slice(0,200)}
    catch(e){$("kRes").textContent="Keine Verbindung: "+(e.message||e.name)+" · Länge des Schlüssels: "+k.length}};
  $("sTest").onclick=()=>{unlockAudio();const o={v:S.voice,r:S.rate};S.voice=$("sVoice").value;S.rate=+$("sRate").value;speak(`Hallo ${main().name}, so klinge ich. Passt das für dich?`);S.voice=o.v;S.rate=o.r};
  const ed=$("profEd");let draft=JSON.parse(JSON.stringify(profiles)),syncs=[];
  const drawProfiles=()=>{ed.innerHTML="";syncs=[];draft.forEach((p,i)=>{const box=document.createElement("div");box.className="prof";
    box.innerHTML=`<div class="grid2"><div class="field"><label for="pn${i}">Name</label><input type="text" id="pn${i}"></div><div class="field"><label for="pt${i}">Art</label><select id="pt${i}" ${p.typ==="haupt"?"disabled":""}><option value="haupt" ${p.typ==="haupt"?"":"hidden"}>Hauptnutzer</option><option value="erwachsen">Erwachsen</option><option value="kind">Kind</option></select></div></div>
      <div class="field"><label for="pi${i}">Info für Atlas (optional)</label><input type="text" id="pi${i}" placeholder="z. B. Alter, Hobbys"></div>
      <div class="grid2" ${p.typ==="kind"?"hidden":""}><div class="field"><label for="pr${i}">Routine</label><textarea id="pr${i}"></textarea></div><div class="field"><label for="ps${i}">Supplements</label><textarea id="ps${i}"></textarea></div></div>
      ${p.typ==="haupt"?"":`<div class="row"><button class="btn small" type="button" id="pd${i}">Entfernen</button></div>`}`;
    ed.append(box);$("pn"+i).value=p.name;$("pt"+i).value=p.typ;$("pi"+i).value=p.info||"";$("pr"+i).value=p.routine.join("\n");$("ps"+i).value=p.supps.join("\n");
    const sync=()=>{p.name=$("pn"+i).value.trim()||p.name;p.typ=p.typ==="haupt"?"haupt":$("pt"+i).value;p.info=$("pi"+i).value.trim();p.routine=$("pr"+i).value.split("\n").map(s=>s.trim()).filter(Boolean);p.supps=$("ps"+i).value.split("\n").map(s=>s.trim()).filter(Boolean)};
    syncs.push(sync);box.querySelectorAll("input,textarea,select").forEach(x=>x.addEventListener("change",()=>{const t=p.typ;sync();if(t!==p.typ)drawProfiles()}));
    if($("pd"+i))$("pd"+i).onclick=()=>{draft.splice(i,1);drawProfiles()}})};
  drawProfiles();
  $("pAdd").onclick=()=>{draft.push({id:"p"+Date.now().toString(36),name:"Neue Person",typ:"erwachsen",info:"",routine:[],supps:[],notes:[]});drawProfiles()};
  $("sSave").onclick=async()=>{S.key=cleanKey($("sKey").value);S.model=$("sModel").value;S.aname=$("sName").value.trim()||"Atlas";S.orb=$("sOrb").value;S.fx=$("sFx").value;S.palette=$("sPal").value;S.voice=$("sVoice").value;S.rate=+$("sRate").value;S.cool=Math.max(1,+$("sCool").value||20);S.sens=+$("sSens").value;S.lockHours=Math.min(48,Math.max(1,+$("sLock").value||16));S.noSearch=false;
    saveSettings();vis.variant=S.orb;vis.fx=S.fx;vis.palette=S.palette;vis.label=S.aname.toUpperCase();
    syncs.forEach(f=>f());
    profiles=draft.map(p=>({notes:[],...p}));saveProfiles();cur=cur.typ==="gast"?cur:(findProfile(cur.name)||main());renderPerson();
    if(privKey){const u=$("bUrl").value.trim(),t=$("bTok").value;if(u){bridge={url:u,token:t};await putSealed("bridge",bridge)}else{bridge=null;ls.del("bridge")}}
    applyNames();renderSetupBar();$("sMsg").textContent="Gespeichert.";if(S.key&&!vault())askCode(null,"create")};
}

/* ================= Abwesenheitsmodus ================= */
/* Tablet komplett gesperrt, nur Marios Sprachcode öffnet es wieder. Bewegungen werden verschlüsselt protokolliert. */
let away=!!ls.get("away",false),codeTries=0,codeBlock=0,lastNotify=0;
const voiceCode=()=>ls.get("voicecode",null);
async function sha(t){const b=await crypto.subtle.digest("SHA-256",te.encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const words=t=>norm(t).split(/\s+/).filter(Boolean);
async function setVoiceCode(phrase){const w=words(phrase);if(w.length<3)return false;const salt=toB64(rnd(16));ls.set("voicecode",{salt,hash:await sha(salt+"|"+w.join(" ")),n:w.length});return true}
async function checkVoiceCode(said){const vc=voiceCode();if(!vc)return false;const w=words(said);for(let i=0;i+vc.n<=w.length;i++)if(await sha(vc.salt+"|"+w.slice(i,i+vc.n).join(" "))===vc.hash)return true;return false}
function applyAway(){document.body.classList.toggle("away",away);$("awayBar").hidden=!away;if(away){$("awayBar").textContent="Abwesenheitsmodus · Gesperrt";["sheet","codeModal","askModal","typeForm"].forEach(id=>$(id).hidden=true)}setMode(vis.mode,idleLabel())}
function awayLog(typ,info){putSealed("away:"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),{typ,info:info||"",zeit:new Date().toISOString()})}
function notify(text){const n=ls.get("notify",null);if(!n||!n.url||!n.word||Date.now()-lastNotify<10*60000)return;lastNotify=Date.now();
  fetch(n.url+(n.url.includes("?")?"&":"?")+"a=melden&m="+encodeURIComponent(n.word)+"&text="+encodeURIComponent(text),{mode:"no-cors"}).catch(()=>{})}
async function startAway(){if(!voiceCode())return;convo=false;try{rec&&rec.abort()}catch{}listening=false;abortCtl?.abort();busy=false;
  away=true;ls.set("away",true);lockVault();if(cur.typ!=="haupt")setPerson(main().name);applyAway();awayLog("start");if(!stream)startRoom()}
function endAway(){away=false;ls.set("away",false);applyAway();awayLog("ende")}
function awayVisitor(){awayLog("bewegung");notify(`Atlas: Bewegung im Biohacking-Raum um ${hhmm()} Uhr (Abwesenheitsmodus).`);
  speak(pick([`Hallo! ${main().name} ist gerade nicht da. Ich bin ${S.aname}, das Tablet ist gesperrt.`,`Hallo. ${main().name} ist nicht da. Der Raum ist im Abwesenheitsmodus.`]))}
function listenForCode(){
  convo=false;listening=false;try{rec&&rec.abort()}catch{}recActive=false;
  if(!SR){$("awayBar").textContent="Spracheingabe fehlt in diesem Browser";return}
  if(Date.now()<codeBlock){speak("Zu viele Versuche. Bitte später nochmal.");return}
  speak("Sprachcode bitte.",()=>{rec=new SR();rec.lang="de-DE";rec.interimResults=false;rec.continuous=false;let got="";
    rec.onstart=()=>{listening=true;setMode("listen","Sprachcode")};
    rec.onresult=e=>{got=[...e.results].map(r=>r[0].transcript).join(" ")};
    rec.onerror=()=>{listening=false};
    rec.onend=async()=>{listening=false;setMode("idle",idleLabel());if(!got.trim())return;
      if(await checkVoiceCode(got)){codeTries=0;endAway();setPerson(main().name);log=log.filter(m=>m.rolle!=="intern");speak(`Willkommen zurück, ${main().name}. Der Abwesenheitsmodus ist aus.`)}
      else{codeTries++;awayLog("code-falsch");notify(`Atlas: Falscher Sprachcode am Tablet um ${hhmm()} Uhr.`);
        if(codeTries>=3){codeBlock=Date.now()+5*60000;codeTries=0;speak("Das war nicht richtig. Das Tablet bleibt jetzt fünf Minuten gesperrt.")}else speak("Das war nicht richtig.")}};
    try{rec.start()}catch{}})}
// Keine Zoom-, Kontextmenü- oder Ziehgesten
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>{const t=e.target;if(away||!(t.closest&&t.closest("input,textarea")))e.preventDefault()});
document.addEventListener("dragstart",e=>e.preventDefault());

/* ================= Start ================= */
function applyNames(){$("aname").textContent=S.aname;document.title=S.aname;setMode(vis.mode,idleLabel())}
function tick(){const d=new Date();$("clock").textContent=hhmm(d);$("dateline").textContent=d.toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
  if(privKey&&Date.now()-unlockedAt>S.lockHours*3600e3)lockVault();
  if(dayKey()!==today){const old=today,L=log.slice();clearTimeout(protoTimer);
    (async()=>{try{const t=await summarize(old,L);if(t)await saveProto(old,SESSION,t)}catch{}})();today=dayKey();log=[];protoLen=0;persistChain=Promise.resolve()}}
setInterval(tick,15000);tick();applyNames();renderPerson();renderLock();applyAway();if(away)startRoom();
if(!window.isSecureContext||!crypto.subtle)showErr("Dieses Gerät erlaubt hier keine Verschlüsselung. Bitte über eine https-Adresse öffnen.");
if(!SR)$("state").textContent="Bereit · Spracheingabe nur in Safari oder Chrome";
</script>
