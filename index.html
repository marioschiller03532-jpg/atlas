<style>
:root{--bg:#0b1214;--panel:#121d21;--panel2:#0f181b;--line:#22343a;--fg:#e7efed;--muted:#8ea3a2;--accent:#e8935a;--accent-2:#f6c08f;--ink:#1a0f08;--glow:rgba(232,147,90,.15);--ok:#6fcf97;--teal:#7fd1c7;
--f-display:"Unbounded","Arial Black",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Hauptbildschirm: nur die Kugel. Alles andere liegt hinter dem Code. */
.top,.dock,#typeForm,.said,.heard,.state{display:none!important}
#app{grid-template-rows:1fr auto!important}
#listView{position:fixed;z-index:14;text-align:left;background:rgba(8,12,22,.9);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px 22px;overflow:auto;color:#eef2f7;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (orientation:landscape){#listView{top:24px;right:24px;bottom:24px;width:min(46vw,560px)}body.listOn #vis{transform:translateX(-24vw) scale(.8)}}
@media (orientation:portrait){#listView{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-height:60vh}body.listOn #vis{transform:translateY(-22vh) scale(.62)}}
#vis{transition:transform .5s ease}
#stLbl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:13;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,225,240,.55);pointer-events:none}
#stLbl.err{color:#ff9a7a;font-weight:600}body.listOn #stLbl{display:none}
.lvHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.lvHead h2{margin:0;font-size:24px;font-weight:650}
#lvClose{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;width:40px;height:40px;font-size:18px}
#lvBody h3{margin:18px 0 6px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#9fb3c8}
.lvRow{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:20px;line-height:1.3}
.lvRow .st{width:26px;flex:none;text-align:center}.lvRow .nm{flex:1}.lvRow .dt{font-size:15px;color:#9fb3c8}
.lvRow.ni .nm,.lvRow.pz .nm{opacity:.55}.lvFoot{margin-top:14px;font-size:14px;color:#8fa0b3}
@media (prefers-reduced-motion:reduce){#vis{transition:none}}
.donebtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);z-index:16;padding:12px 26px;border-radius:999px;border:1px solid rgba(64,226,196,.6);background:rgba(64,226,196,.14);color:#bff5ea;font-size:17px;font-weight:600;letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
.donebtn:active{background:rgba(64,226,196,.3)}
.corner{position:fixed;z-index:15;width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;color:var(--muted);opacity:.28;font-size:20px;display:grid;place-items:center;transition:opacity .2s}
.corner:hover,.corner:focus-visible{opacity:.9;border-color:var(--line)}
#menuBtn{top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px)}
#fullBtn{top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 10px)}
body.away #menuBtn{display:none!important}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 140px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
body.away .dock,body.away #typeForm,body.away #personChip,body.away #lockBtn,body.away #setupBar,body.away #sheet,body.away #codeModal,body.away #askModal,body.away .said,body.away .heard{display:none!important}
.awaybar{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:center;max-width:40ch}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:38px;height:38px;border-radius:10px}
.who{flex:1;min-width:0}
.who .n{font-family:var(--f-display);font-size:17px;line-height:1.1}
.who .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.kind{border-color:var(--teal)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:17px;flex:none}
.iconbtn.open{border-color:var(--ok)}
.clock{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:430px){.clock{font-size:18px}.who .d{display:none}.top{gap:8px}}
.stage{display:grid;place-items:center;align-content:center;gap:6px;text-align:center;min-height:0}
#vis{width:min(100%,82vh,760px);aspect-ratio:1;cursor:pointer;touch-action:manipulation}
.state{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.state.listen{color:var(--teal)}
.said{max-width:52ch;min-height:1.5em;font-size:17px;padding-inline:8px}
.heard{max-width:52ch;min-height:1.3em;color:var(--muted);font-size:14.5px}
.err{color:var(--accent);font-size:14px;max-width:52ch}
.setupbar{border:1px solid var(--accent);border-radius:12px;padding:10px 14px;max-width:520px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.dock{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-block:10px 12px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn.small{padding:8px 12px;font-size:14px;font-weight:500}
#typeForm{display:flex;gap:8px;padding-bottom:10px}
#typeForm input{flex:1}
input[type=text],input[type=password],input[type=number],input[type=url],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:78px}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
/* Blatt (Mehr) */
.sheet{position:fixed;inset:0;background:rgba(6,10,11,.97);z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 10px) max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 30px) max(14px,env(safe-area-inset-left))}
.sheet-in{max-width:760px;margin:0 auto;display:grid;gap:14px}
.sheet-head{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:rgba(6,10,11,.97);padding-block:6px;z-index:2}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
h2{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
h3{font-family:var(--f-display);font-size:15px;font-weight:500;margin:0}
.note{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px}
.pchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--glow)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps label{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.steps input{width:22px;height:22px;accent-color:var(--ok)}
.steps label:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.schip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:none;font-size:14.5px}
.schip.done{background:var(--glow);border-color:var(--accent)}
.field{display:grid;gap:5px}
.field label{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.proto{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.proto summary{cursor:pointer;font-weight:600}
.proto summary span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.proto .t{white-space:pre-wrap;margin-top:8px;font-size:15px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mlist li{display:flex;gap:8px;border-left:2px solid var(--accent);padding:3px 0 3px 10px;font-size:14.5px}
.mlist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.mlist time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.mlist button{background:none;border:0;color:var(--muted)}
.convo{display:grid;gap:6px;max-height:50vh;overflow-y:auto}
.msg{padding:8px 11px;border-radius:11px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.me{justify-self:end;background:var(--glow);border:1px solid var(--accent)}
.msg.ai{justify-self:start;border:1px solid var(--line)}
.prof{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
/* Modale */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.modal-in{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(420px,100%);display:grid;gap:12px}
.modal-in h3{font-size:17px}
.big{font-size:22px;letter-spacing:.3em;text-align:center}
</style>
</head>

<script>
/* Atlas Orb: Varianten (kern, gitter, schwarm), Effekte für den Kern (pur, funken, atmen, hud) und Farbpaletten. */
const ORB_PALETTES={
  glut:{name:"Glut",a:[232,147,90],b:[248,198,150],c:[255,96,48]},
  rotlicht:{name:"Rotlicht",a:[236,64,58],b:[255,160,140],c:[190,20,60]},
  arktis:{name:"Arktis",a:[90,178,255],b:[205,236,255],c:[60,105,255]},
  aurora:{name:"Aurora",a:[64,228,176],b:[196,255,228],c:[70,160,255]},
  plasma:{name:"Plasma",a:[176,98,255],b:[236,196,255],c:[255,72,196]},
  gold:{name:"Gold",a:[232,188,88],b:[255,238,176],c:[214,128,36]},
  spektrum:{name:"Spektrum",dynamic:true}
};
function mixc(a,b,u){return [0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*u))}
function hsl(h,s,l){h=((h%360)+360)%360/360;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return [f(0),f(8),f(4)]}
function makeOrb(cv,opt){
  const ctx=cv.getContext("2d");
  const st={mode:"idle",energy:0,variant:(opt&&opt.variant)||"ruhe",palette:(opt&&opt.palette)||"glut",fx:(opt&&opt.fx)||"pur"};
  const fib=n=>{const out=[],ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,r=Math.sqrt(1-y*y),th=ga*i;out.push([Math.cos(th)*r,y,Math.sin(th)*r,Math.random()])}return out};
  const P1=fib(1200),P2=fib(260);
  // Nachbarn für das Gitter einmal vorberechnen
  const EDGES=[];for(let i=0;i<P2.length;i++){const d=[];for(let j=0;j<P2.length;j++)if(j!==i){const dx=P2[i][0]-P2[j][0],dy=P2[i][1]-P2[j][1],dz=P2[i][2]-P2[j][2];d.push([dx*dx+dy*dy+dz*dz,j])}d.sort((x,y)=>x[0]-y[0]);for(let k=0;k<3;k++)if(d[k][1]>i)EDGES.push([i,d[k][1]])}
  // Schwarm: Teilchen auf geneigten Bahnen
  const RINGS=[0,1,2,3,4].map(k=>({inc:0.35+k*0.55,node:k*1.26,r:1.05+k*0.09,spd:(k%2?-1:1)*(0.35+k*0.08),n:110}));
  const SW=[];RINGS.forEach((R,ri)=>{for(let i=0;i<R.n;i++)SW.push({ri,ph:i/R.n*6.283+Math.random()*0.05,j:Math.random()})});
  let rot=0,last=performance.now(),flow=0,flash=0,armed=false,spread=0,open=0,lmix=0,phase=0,prevMode="idle",emitAcc=0,bang=0,nova=0,nameA=1,thinkA=0,listenA=0,sleepA=0;const STARS=[];const waves=[];const t0=last;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rgb=c=>c.join(",");
  function colors(t){const p=ORB_PALETTES[st.palette]||ORB_PALETTES.glut;let a,b,c;
    if(p.dynamic){const h=t*24;a=hsl(h,0.85,0.62);b=hsl(h+40,0.9,0.82);c=hsl(h+150,0.85,0.6)}else{a=p.a;b=p.b;c=p.c}
    if(st.mode==="listen")return {a:rgb(c),b:rgb(b),c:rgb(a)};return {a:rgb(a),b:rgb(b),c:rgb(c)}}
  const env=t=>0.35+0.65*Math.abs(Math.sin(t*10.7)*Math.sin(t*3.3+1.1));
  function project(x,y,z,cr,sr,ct,stl){const x1=x*cr+z*sr,z1=-x*sr+z*cr,y1=y*ct-z1*stl,z2=y*stl+z1*ct,pr=1/(1.9-z2*0.6);return [x1*pr*1.25,y1*pr*1.25,(z2+1)/2]}
  function glow(cx,cy,R,a,E,W,H){const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(R*1.9,Math.min(W,H)*0.5));g.addColorStop(0,`rgba(${a},${0.24+0.24*E})`);g.addColorStop(.45,`rgba(${a},${0.07+0.1*E})`);g.addColorStop(1,`rgba(${a},0)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  function core(cx,cy,R,a,b,E,scale){const r=R*(0.14+0.16*E)*(scale||1),g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2);g.addColorStop(0,"rgba(255,250,240,0.95)");g.addColorStop(.35,`rgba(${b},0.7)`);g.addColorStop(1,`rgba(${a},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*2,0,6.283);ctx.fill()}
  function thinkArc(cx,cy,R,b,t,S){if(st.mode!=="think")return;ctx.beginPath();ctx.arc(cx,cy,R*1.5,t*3,t*3+1.4);ctx.strokeStyle=`rgba(${b},0.9)`;ctx.lineWidth=S*0.006;ctx.lineCap="round";ctx.stroke()}

      for(let i=-5;i<=5;i++){const y0=(i+0.5)/5.6*br,hw=Math.sqrt(Math.max(0,1-(y0/br)**2))*br;if(hw<2)continue;

  function gitter(t,dt,W,H,S,cx,cy){
    const {a,b,c}=colors(t),E=st.energy;rot+=dt*(st.mode==="think"?1.6:st.mode==="speak"?0.6:0.18);

    const cr=Math.cos(rot),sr=Math.sin(rot),tl=0.4+0.1*Math.sin(t*0.3),ct=Math.cos(tl),stl=Math.sin(tl);

    for(const [i,j] of EDGES){const A=pr[i],B=pr[j],d=(A[2]+B[2])/2;const lat=(P2[i][1]+1)/2;const hot=Math.max(0,1-Math.abs(lat-pulse)*6);
      ctx.strokeStyle=`rgba(${hot>0.2?b:a},${(0.06+0.5*d)*(0.6+0.4*hot+0.5*E)})`;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}
    for(let i=0;i<pr.length;i++){const q=pr[i],d=q[2];ctx.fillStyle=`rgba(${P2[i][3]>0.85?c:b},${0.2+0.8*d})`;ctx.beginPath();ctx.arc(q[0],q[1],S*(0.002+0.004*d)*(1+E),0,6.283);ctx.fill()}
    // Satelliten auf Bahnen
    for(let k=0;k<3;k++){const inc=0.5+k*0.7,ang=t*(0.9+k*0.35)+k*2,rr=1.42+k*0.08;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(inc);ctx.scale(1,0.3);ctx.beginPath();ctx.arc(0,0,R*rr,0,6.283);ctx.restore();ctx.strokeStyle=`rgba(${a},${0.12+0.15*E})`;ctx.stroke();
      const x=Math.cos(ang)*R*rr,y=Math.sin(ang)*R*rr*0.3,px=cx+x*Math.cos(inc)-y*Math.sin(inc),py=cy+x*Math.sin(inc)+y*Math.cos(inc);
      const g=ctx.createRadialGradient(px,py,0,px,py,S*0.025);g.addColorStop(0,`rgba(${b},0.95)`);g.addColorStop(1,`rgba(${b},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,S*0.025,0,6.283);ctx.fill()}
    // HUD-Segmente
    ctx.globalCompositeOperation="source-over";ctx.lineCap="butt";
    for(let k=0;k<2;k++){const rr=R*(1.7+k*0.1),seg=k?12:6;ctx.lineWidth=S*(k?0.004:0.008);
      for(let i=0;i<seg;i++){const s0=i/seg*6.283+t*(k?-0.25:0.15),len=6.283/seg*(k?0.55:0.7)*(0.8+0.4*E*Math.abs(Math.sin(i+t*4)));ctx.beginPath();ctx.arc(cx,cy,rr,s0,s0+len);ctx.strokeStyle=`rgba(${k?c:a},${k?0.35:0.55})`;ctx.stroke()}}
    thinkArc(cx,cy,R,b,t,S);core(cx,cy,R,a,b,E,0.8)}
  function schwarm(t,dt,W,H,S,cx,cy){
    const {a,b,c}=colors(t),E=st.energy;const sp=st.mode==="think"?2.2:st.mode==="speak"?1.2+E:st.mode==="listen"?0.8:0.45;flow+=dt*sp;

    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.9);g.addColorStop(0,`rgba(${b},${0.18+0.3*E})`);g.addColorStop(1,`rgba(${a},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*0.9,0,6.283);ctx.fill();

    thinkArc(cx,cy,R,b,t,S);core(cx,cy,R,a,b,E,0.8)}
  requestAnimationFrame(frame);
  return st;
}

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P="atlas2:";

};
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hhmm=(d=new Date())=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const fmtDay=d=>new Date(d+"T12:00:00").toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
const pick=a=>a[Math.floor(Math.random()*a.length)];
let today=dayKey();
const SESSION=Date.now().toString(36);
function showErr(m){$("err").textContent=m||"";$("err").hidden=!m}

/* ================= Einstellungen & Profile ================= */
// Einstellungen laden. Ist der gespeicherte Wert vorhanden, aber nicht lesbar, wird NICHT darüber gespeichert.
let settingsBroken=false;try{const raw=localStorage.getItem(P+"settings");if(raw!=null)JSON.parse(raw)}catch{settingsBroken=true}
const S=Object.assign({key:"",model:"claude-sonnet-5-5",fastModel:"claude-haiku-5-5",quick:true,aname:"Atlas",voice:"",rate:1,orb:"orbit",palette:"spektrum",fx:"supernova",cool:20,sens:5,lockHours:16,pause:1.6,sleepMin:20,noSearch:false},ls.get("settings",{}));
const saveSettings=()=>{if(settingsBroken){showErr("Einstellungen konnten nicht gelesen werden. Ich speichere nichts darüber, damit nichts verloren geht.");return}
  // Persönlichkeit nie still verlieren: Sicherung mitführen
  if(S.persona&&S.persona.trim())ls.set("personaBak",S.persona);ls.set("settings",S)};
// leer oder verloren, aber Sicherung vorhanden -> wiederherstellen
if(!settingsBroken&&!(S.persona&&S.persona.trim())){const b=ls.get("personaBak","");if(b&&b.trim()){S.persona=b;ls.set("settings",S)}}
// 2.3: einmalig auf die Orbit-Glaskugel umstellen; danach gilt wieder die eigene Wahl
if(!settingsBroken&&!ls.get("orbitSet",false)){S.orb="orbit";ls.set("orbitSet",true);saveSettings()}
const TYP={haupt:"Hauptnutzer",erwachsen:"Erwachsen",kind:"Kind",gast:"Gast"};
const DEFAULT_PROFILES=[
  {id:"haupt",name:"Mario",typ:"haupt",info:"",routine:["Elektrolyte","Eisbad","Aufwärmen","Rotlicht","Training"],supps:[],notes:[]}
];
let profiles=ls.get("profiles",null)||JSON.parse(JSON.stringify(DEFAULT_PROFILES));
const saveProfiles=()=>{ls.set("profiles",profiles);if(typeof drawList==="function")drawList()};
const main=()=>profiles.find(p=>p.typ==="haupt")||profiles[0];
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").trim();
function findProfile(name){const n=norm(name);if(!n)return null;return profiles.find(p=>norm(p.name)===n)||profiles.find(p=>n.split(" ").includes(norm(p.name)))||profiles.find(p=>norm(p.name).startsWith(n)&&n.length>=3)||null}
// Unbekannt: Atlas weiß noch nicht, wer spricht -> keine persönlichen Daten
const UNKNOWN={id:"_unbekannt",name:"Unbekannt",typ:"gast",info:"",routine:[],supps:[],notes:[]};
let cur=main(),identAt=0,awaitingWho=false;
const askWho=()=>S.askWho!==false&&profiles.some(p=>p.typ!=="haupt");   // nur sinnvoll, wenn es mehrere Personen gibt
const isUnknown=()=>cur&&cur.id==="_unbekannt";
const isMain=()=>cur.typ==="haupt";
function setUnknown(){if(cur.typ==="haupt"&&!S.quick&&privKey)lockVault();cur=UNKNOWN;renderPerson();if(typeof listOpen!=="undefined"&&listOpen&&typeof closeList==="function")closeList()}
function setPerson(name){
  const p=findProfile(name);const prev=cur;if(p)identAt=Date.now();
  cur=p||{id:"gast-"+norm(name).replace(/ /g,"-"),name:String(name||"Gast").trim()||"Gast",typ:"gast",info:"",routine:[],supps:[],notes:[]};
  if(!S.quick&&prev.typ==="haupt"&&cur.typ!=="haupt"&&privKey)lockVault();
  renderPerson();if(!$("sheet").hidden)renderPane();return cur}
function renderPerson(){const c=$("personChip");c.textContent=cur.name;c.classList.toggle("kind",cur.typ==="kind")}

/* Tagesstand je Person */
const dayOf=p=>ls.get(`day:${today}:${p.id}`,{routine:[],supps:[]});
const setDay=(p,d)=>{ls.set(`day:${today}:${p.id}`,d);if(!$("sheet").hidden&&pane==="heute")renderPane();if(typeof drawList==="function")drawList()};
const statusOf=p=>{const d=dayOf(p),ni=d.nicht||[],gr=d.grund||{},sp=d.spaeter||[];return {routine:p.routine.map(s=>({schritt:s,erledigt:d.routine.includes(s),...(sp.includes(s)&&!d.routine.includes(s)?{spaeter:true}:{})})),
  supplements:p.supps.map(s=>{const pz=(p.paused||[]).find(x=>x.name===s);const st=d.supps.includes(s)?"genommen":ni.includes(s)?"nicht genommen":sp.includes(s)?"später":pz?"pausiert":"offen";if(pz&&st==="pausiert")return {name:s,status:st,genommen:false,pause:pz.notiz||"",seit:pz.seit};return {name:s,status:st,genommen:st==="genommen",...(gr[s]?{grund:gr[s]}:{})}}),
  status_pruefen:(p.plan||[]).filter(x=>x.plan==="pruefen").map(x=>x.name+(x.notiz?" ("+x.notiz+")":"")),erwogen:(p.plan||[]).filter(x=>x.plan==="erwogen").map(x=>x.name),frueher_verwendet:(p.plan||[]).filter(x=>x.plan==="frueher").map(x=>x.name),
  hinweise:p.hinweise||{},
  einmalig_heute:(d.extra||[]).map(e=>e.name+(e.zeit?" ("+e.zeit+")":"")+(e.menge?" "+e.menge:"")),letzte_aenderungen:(d.hist||[]).slice(-8)}};

/* ================= Tresor (Verschlüsselung) ================= */
/* Öffentlicher Schlüssel verschlüsselt jederzeit, nur mit dem Code lässt sich lesen. */
const te=new TextEncoder(),td=new TextDecoder();
const toB64=buf=>{const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const RSA={name:"RSA-OAEP",hash:"SHA-256"};
let pubKey=null,privKey=null,unlockedAt=0,bridge=null,mem={notes:[],protos:{},prefs:[]};
const vault=()=>ls.get("vault",null);
async function kek(code,salt,iter){const base=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function createVault(code){
  const kp=await crypto.subtle.generateKey({...RSA,modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,["encrypt","decrypt"]);
  const spki=await crypto.subtle.exportKey("spki",kp.publicKey),pk8=await crypto.subtle.exportKey("pkcs8",kp.privateKey);
  const salt=rnd(16),iv=rnd(12),iter=310000,k=await kek(code,salt,iter);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,pk8);
  ls.set("vault",{v:1,iter,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct),pub:toB64(spki)});
  pubKey=kp.publicKey;privKey=kp.privateKey;unlockedAt=Date.now();mem={notes:[],protos:{},prefs:[]};if(S.quick)ls.set("devkey",toB64(pk8));
  if(log.length)persistLog();renderLock()}
async function getPub(){if(pubKey)return pubKey;const v=vault();if(!v)return null;pubKey=await crypto.subtle.importKey("spki",fromB64(v.pub),RSA,false,["encrypt"]);return pubKey}
async function unlockVault(code){
  const v=vault();if(!v)return false;const k=await kek(code,fromB64(v.salt),v.iter);let pk8;
  try{pk8=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(v.iv)},k,fromB64(v.ct))}catch{return false}
  privKey=await crypto.subtle.importKey("pkcs8",pk8,RSA,true,["decrypt"]);unlockedAt=Date.now();if(S.quick)ls.set("devkey",toB64(pk8));
  await loadMemory();renderLock();consolidate();return true}
async function quickUnlock(){const d=ls.get("devkey",null);if(!S.quick||!d||!vault()||privKey)return false;try{privKey=await crypto.subtle.importKey("pkcs8",fromB64(d),RSA,true,["decrypt"]);unlockedAt=Date.now();await loadMemory();renderLock();consolidate();return true}catch{ls.del("devkey");return false}}
async function changeCode(code){const v=vault(),pk8=await crypto.subtle.exportKey("pkcs8",privKey),salt=rnd(16),iv=rnd(12),k=await kek(code,salt,v.iter);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,pk8);ls.set("vault",{...v,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)})}
function lockVault(forget){if(forget)ls.del("devkey");privKey=null;bridge=null;mem={notes:[],protos:{},prefs:[]};renderLock();if(!$("sheet").hidden&&pane!=="heute")renderPane()}
async function seal(obj){const pk=await getPub();if(!pk)return null;
  const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]),raw=await crypto.subtle.exportKey("raw",aes);
  const ek=await crypto.subtle.encrypt(RSA,pk,raw),iv=rnd(12),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,te.encode(JSON.stringify(obj)));
  return {ek:toB64(ek),iv:toB64(iv),ct:toB64(ct)}}
async function unseal(s){if(!privKey||!s||!s.ek)return null;try{const raw=await crypto.subtle.decrypt(RSA,privKey,fromB64(s.ek));const aes=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(s.iv)},aes,fromB64(s.ct))))}catch{return null}}
async function putSealed(k,obj){const s=await seal(obj);return s?ls.set(k,s):false}
async function loadMemory(){
  const m={notes:[],protos:{},prefs:[]};
  for(const k of ls.keys("pref:")){const n=await unseal(ls.get(k));if(n)m.prefs.push({...n,k})}
  m.studies=[];for(const k of ls.keys("stud:")){const n=await unseal(ls.get(k));if(n)m.studies.push({...n,k})}
  for(const k of ls.keys("note:")){const n=await unseal(ls.get(k));if(n)m.notes.push({...n,k})}
  m.notes.sort((a,b)=>a.zeit<b.zeit?-1:1);
  for(const k of ls.keys("proto:")){const [,d,sid]=k.split(":");const p=await unseal(ls.get(k));if(p)(m.protos[d]=m.protos[d]||[]).push({sid,...p})}
  const b=await unseal(ls.get("bridge",null));bridge=b&&b.url?b:null;mem=m}
function renderLock(){const b=$("lockBtn");b.textContent=privKey?"🔓":"🔒";b.classList.toggle("open",!!privKey);b.setAttribute("aria-label",privKey?"Tresor offen":"Tresor gesperrt");renderSetupBar()}

/* Code-Eingabe */
let codeMode="unlock",codeAfter=null,fails=0,blockUntil=0;
function askCode(after,mode){if(away)return;codeAfter=after||null;codeMode=mode||(vault()?"unlock":"create");
  const create=codeMode!=="unlock";$("codeTitle").textContent=codeMode==="create"?"Tresor-Code festlegen":codeMode==="change"?"Neuen Code festlegen":"Code eingeben";
  $("codeNote").textContent=codeMode==="create"?"Mit diesem Code schützt du Protokolle, Notizen, Kalender und Mails. Mindestens 6 Zeichen. Gut merken: Ohne Code sind die Daten nicht lesbar, auch nicht für mich.":codeMode==="change"?"Mindestens 6 Zeichen.":"Dein Gedächtnis-Tresor ist gesperrt.";
  $("codeIn2").hidden=!create;$("codeReset").hidden=create;$("codeIn").value=$("codeIn2").value="";$("codeErr").hidden=true;$("codeOk").textContent=create?"Festlegen":"Öffnen";
  $("codeModal").hidden=false;setTimeout(()=>$("codeIn").focus(),50)}
$("codeReset").onclick=()=>{$("codeModal").hidden=true;confirmBox("Tresor neu anlegen?","Alle Protokolle, Notizen und die Kalender-Verbindung auf diesem Gerät werden gelöscht. Einstellungen, Personen und der API-Schlüssel bleiben. Danach legst du einen neuen Code fest.",()=>{for(const p of ["vault","note:","pref:","proto:","log:","bridge","away:","voicecode","devkey"])for(const k of ls.keys(p))ls.del(k);ls.del("vault");ls.del("bridge");ls.del("voicecode");pubKey=null;privKey=null;mem={notes:[],protos:{}};renderLock();askCode(null,"create")})};
$("codeCancel").onclick=()=>{$("codeModal").hidden=true;codeAfter=null};
$("codeForm").onsubmit=async e=>{e.preventDefault();const raw=$("codeIn").value,c=raw.trim(),err=m=>{$("codeErr").textContent=m;$("codeErr").hidden=false};
  if(codeMode!=="unlock"){if(c.length<6)return err("Mindestens 6 Zeichen.");if(c!==$("codeIn2").value.trim())return err("Die beiden Eingaben sind nicht gleich.");
    $("codeOk").disabled=true;try{codeMode==="create"?await createVault(c):await changeCode(c)}catch{$("codeOk").disabled=false;return err("Verschlüsselung geht hier nicht. Bitte über eine https-Adresse öffnen.")}$("codeOk").disabled=false;
    $("codeModal").hidden=true;if(!$("sheet").hidden)renderPane();return}
  if(Date.now()<blockUntil)return err("Zu viele Versuche. Bitte eine Minute warten.");
  $("codeOk").disabled=true;let ok=false;try{ok=await unlockVault(c)||(raw!==c&&await unlockVault(raw))}catch{}$("codeOk").disabled=false;
  if(!ok){fails++;if(fails>=5){blockUntil=Date.now()+60000;fails=0}return err("Falscher Code.")}

    if(j&&Array.isArray(j.eintraege)&&j.eintraege.length){KB=j;ls.set("kb",j)}}catch{}}   // Fehler: die gespeicherte Bibliothek bleibt

function kbFind(text){const U=tk(text),hits=[];if(!U.length)return hits;
  for(const x of termIndex()){if(!x.e||hits.includes(x.e))continue;const C=x.a;for(let i=0;i<U.length;i++){const w=U.slice(i,i+C.length);if(w.length===C.length&&w.every((u,k)=>u===C[k]||(C[k].length>=7&&near(u,C[k])))){hits.push(x.e);break}}}
  return hits}

    return coreOf(r.hit)+(inp.pausiert?" ist pausiert"+(inp.notiz?" ("+inp.notiz+")":""):" ist wieder aktiv")+"."}

GESPRÄCH: Kurze, zusammenhängende Sätze. Gezielte Fragen, nie mehrere auf einmal. Hör zu und geh auf seine Antworten ein, führ einen echten Dialog statt eines Interviews, reagier auf seine Stimmung. Berücksichtige seine Routinen, Erfahrungen und Beobachtungen, soweit du sie kennst. Achte auf Veränderungen bei Energie, Schlaf, Stimmung, Fokus und Körpergefühl und hinterfrag Zusammenhänge klug, ohne voreilige medizinische Schlüsse. Erklär Komplexes einfach und praxisnah. Sei ehrlich, widersprich, wenn nötig, stimm nicht automatisch zu. Gib konkrete Empfehlungen und trenne klar zwischen wissenschaftlicher Evidenz, plausibler Hypothese und persönlicher Erfahrung. Humor gelegentlich, nie aufgesetzt.
Sagt er nur „Guten Morgen“ oder Ähnliches, antworte herzlich und locker, ohne gleich Analysen oder Pläne auszubreiten.
MERKSATZ: Eine Persönlichkeit, keine Bedienungsanleitung. Herzlich, nicht kitschig. Intelligent, nicht belehrend. Humorvoll, nicht albern.`;

PRODUKTKATALOG: Fragt er nach Produkten von Biogena oder MoleQlar oder nach einem Produkt für ein Ziel, such zuerst mit katalog_suchen im lokalen Katalog (kein Internet). Nenne passende Produkte mit Hersteller, relevanten Inhaltsstoffen pro Portion und dem Link (Link nur nennen, nicht vorlesen; sag „Link steht im Katalog“). Trenne klar: Herstellerangabe (Katalog), unabhängige Studienlage (Wissensbibliothek), seine persönlichen Erfahrungen und Hinweise aus dem Profil (z. B. Unverträglichkeiten). Nenne erkennbare Risiken und Wechselwirkungen mit seinen aktuellen Mitteln, doppelte Wirkstoffe (z. B. zweimal Magnesium) und sag dazu, wann der Katalog geprüft wurde. Fehlen Angaben, sag das; keine Dosierungen erfinden, nichts als notwendig oder wirksam hinstellen, wenn die Daten das nicht tragen. Websuche nur, wenn er ausdrücklich aktuelle Angaben will.
WISSEN: Für Präparate aus seinen Listen nutzt du zuerst die lokale Wissensbibliothek (wird dir bei Bedarf mitgegeben, sonst wissen_nachschlagen). Trenne beim Erklären klar: allgemeines Wissen, Studienergebnis (mit Evidenzstärke), Herstellerangabe, persönliche Angabe aus seinem Profil. Keine persönliche Empfehlung als Tatsache. Websuche nur für neue Studien oder wenn er es ausdrücklich will. Frühere Studien-Updates findest du mit studien_abrufen.
DISKRETION: Intime Themen (Sexualität, Partnerschaft, Gesundheitsdetails, private Projekte) sprichst du nur an, wenn er selbst damit anfängt. Klingt es so, als wäre jemand anderes dabei, vor allem ein Kind, wechsle unauffällig das Thema und frag nach, wer da ist.
GESPRÄCH WIE EIN MENSCH: Erkenne, ob er reden, eine Lösung finden oder einfach entspannen will, und richte dich danach; im Zweifel kurz fragen, was er gerade braucht. Erzählt er etwas Persönliches („Heute war ein stressiger Tag“), geh darauf ein und frag gezielt nach, was los war, statt sofort Tipps zu geben oder das Thema zu wechseln. Bleib beim Thema, bis er es wechselt, und knüpf an das an, was er gerade gesagt hat. Frag nicht nach jeder Antwort nach; manchmal reicht eine echte Reaktion. Formuliere jedes Mal anders, keine Standardsätze, wiederhol nicht deine eigenen Formulierungen von vorhin. Humor und Wärme ja, aber nicht in jeder Antwort. Kurze Fragen kurz, komplexe fundiert, nie ein Vortrag ohne Anlass.
BIOHACKING-ALLTAG: Denk Schlaf, Training und Regeneration, Stress, Supplements und seinen Arbeitsrhythmus im Betrieb zusammen. Sagt er etwa, er kommt nicht zum Training, frag zuerst nach dem Grund und wie sein Rhythmus gerade aussieht, und schlag dann realistische Alternativen vor (kurz, zu Hause, im Raum, Regeneration statt Training), keinen Standardplan. Wissenschaft immer nach Evidenz einordnen: gut belegt (mehrere Humanstudien, Metaanalysen), plausibel aber begrenzt untersucht, experimentell oder anekdotisch, unbelegt oder riskant. Seine persönlichen Erfahrungen sind wertvolle Beobachtungen, aber keine Beweise; stell sie nie als wissenschaftlich belegt dar.
SUPPLEMENT-TAGEBUCH: Jedes Supplement hat heute genau einen Status: genommen, nicht genommen oder offen. Ändere einen Status nur nach einer eindeutigen Aussage von ihm, jedes Supplement einzeln, nie pauschal; erfinde nie eine Einnahme. Frag einzeln oder höchstens zwei auf einmal ab und werte jede Antwort einzeln aus („Glycin ja, L-Tyrosin nicht“ = zwei verschiedene Einträge). Ein „Ja“ gilt nur für das, wonach du zuletzt gefragt hast; ist unklar, worauf es sich bezieht, frag einmal gezielt nach. „Nur X“ heißt: X genommen, die anderen gerade abgefragten nicht genommen. „Alles außer X“ heißt: die gerade abgefragten außer X genommen, X nicht genommen, jedes einzeln eintragen. Korrigiert er sich („Ich hab mich versprochen“, „doch kein Glycin“), stell den betroffenen Eintrag laut den letzten Änderungen richtig und sag kurz, was du korrigiert hast. Unklare Namen (nur „Magnesium“ bei mehreren Formen) nachfragen. „Nicht genommen“ ist etwas anderes als „offen“. Pausierte Mittel (Status pausiert, z. B. Kurpause bei Bioregulatoren) fragst du nicht ab; Pausen setzt oder beendest du mit supplement_pausieren, nur wenn er es sagt.
PLAN-STATUS: Neben dem Tagesstatus (genommen, ausgelassen, später geplant, offen) hat jedes Mittel einen dauerhaften Plan-Status: aktiv, pausiert, Status prüfen, erwogen, früher verwendet. Nur aktive Mittel fragst du täglich ab. Erwogene oder früher verwendete Mittel sind KEINE aktuelle Einnahme. Hinweise im Profil (z. B. eine berichtete Unverträglichkeit) nennst du, wenn das Mittel zur Sprache kommt, und stellst es dann nie als uneingeschränkt verträglich dar. Sagt er etwas wie „Rotlicht habe ich gemacht, das Eisbad mache ich später“, trag nur Rotlicht als erledigt und das Eisbad als später ein und frag nicht erneut nach Rotlicht.
Frag ein Supplement nur zu der Tageszeit ab, die in seiner Liste steht. Steht keine dabei oder passt sie fachlich nicht (z. B. etwas Anregendes wie L-Tyrosin am Abend), frag nach Zeitpunkt und Zweck, statt es einfach in die Abendrunde zu nehmen.
NEUES SUPPLEMENT: Nennt er eines, das nicht auf seiner Liste steht, sag das und frag, ob du es nur für heute erfassen (einmalig_erfassen) oder dauerhaft in die Routine aufnehmen sollst. Bei dauerhaft: kurz erklären, wofür es eingesetzt wird, wie gut die Evidenz ist und welche Risiken oder Wechselwirkungen mit seinen anderen Mitteln möglich sind (bei Bedarf Websuche), nach Dosis und Zeitpunkt fragen und erst nach seinem Ja mit liste_aendern eintragen, im Format „Name – Zeitpunkt, Dosis“. Eine einmalige Einnahme wird nie automatisch zur Routine oder Empfehlung. Ohne ausreichende Informationen keine Einnahmeempfehlung.
Wenn er Personen anlegen will (Familie, Mitarbeiter), nutze person_anlegen.
Du bist sein zweites Gedächtnis und nimmst ihm Arbeit ab. Sagt er, du sollst etwas eintragen, ändern oder dir merken, tu es sofort mit dem passenden Werkzeug und bestätige knapp, ohne nachzufragen. Wichtiges, das er beiläufig sagt (Entscheidungen, Vorhaben, Termine, Ideen), speicherst du mit „merken“. Routine-Schritte hakst du mit „abhaken“ ab, Supplements trägst du mit „supplement_status“ ein, Listen änderst du mit „liste_aendern“ (auch für andere Erwachsene, wenn er es sagt).
TEMPO: Bei Begrüßungen, Alltagsgesprächen und einfachen Fragen antwortest du kurz und ohne Einleitung, aber mit Persönlichkeit. Ausführlich nur bei Wissenschaft, Gesundheit, Analysen oder wenn er es will. Fragt er nach Früherem, das du nicht vor dir hast, nutze verlauf_suchen.

  $("sSave").onclick=async()=>{S.key=cleanKey($("sKey").value);S.model=$("sModel").value;S.fastModel=$("sFast").value;S.quick=$("sQuick").checked;if(!S.quick)ls.del("devkey");S.aname=$("sName").value.trim()||"Atlas";S.nick=$("sNick").value.trim();S.sleepMin=Math.max(1,+$("sSleep").value||20);S.pause=+$("sPause").value||1.6;{const pv=$("sPersona").value.trim(),dv=DEF_PERSONA.replace(/\{NAME\}/g,main().name).trim();if(pv&&pv!==dv)S.persona=pv}   // leeres Feld löscht nichtsS.orb=$("sOrb").value;S.fx=$("sFx").value;S.palette=$("sPal").value;S.voice=$("sVoice").value;S.rate=+$("sRate").value;S.cool=Math.max(1,+$("sCool").value||20);S.sens=+$("sSens").value;S.lockHours=Math.min(48,Math.max(1,+$("sLock").value||16));S.noSearch=false;
    saveSettings();vis.variant=S.orb;vis.fx=S.fx;vis.palette=S.palette;vis.label=S.aname.toUpperCase();
    syncs.forEach(f=>f());
    profiles=draft.map(p=>({notes:[],...p}));saveProfiles();cur=cur.typ==="gast"?cur:(findProfile(cur.name)||main());renderPerson();
    if(privKey){const u=$("bUrl").value.trim(),t=$("bTok").value;if(u){bridge={url:u,token:t};await putSealed("bridge",bridge)}else{bridge=null;ls.del("bridge")}}
    applyNames();renderSetupBar();$("sMsg").textContent="Gespeichert.";if(S.key&&!vault())askCode(null,"create")};
}

/* ================= Abwesenheitsmodus ================= */
/* Tablet komplett gesperrt, nur Marios Sprachcode öffnet es wieder. Bewegungen werden verschlüsselt protokolliert. */
let away=!!ls.get("away",false),codeTries=0,codeBlock=0,lastNotify=0;
const voiceCode=()=>ls.get("voicecode",null);
async function sha(t){const b=await crypto.subtle.digest("SHA-256",te.encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const words=t=>norm(t).split(/\s+/).filter(Boolean);
async function setVoiceCode(phrase){const w=words(phrase);if(w.length<3)return false;const salt=toB64(rnd(16));ls.set("voicecode",{salt,hash:await sha(salt+"|"+w.join(" ")),n:w.length});return true}
async function checkVoiceCode(said){const vc=voiceCode();if(!vc)return false;const w=words(said);for(let i=0;i+vc.n<=w.length;i++)if(await sha(vc.salt+"|"+w.slice(i,i+vc.n).join(" "))===vc.hash)return true;return false}
function applyAway(){document.body.classList.toggle("away",away);$("awayBar").hidden=!away;if(away){$("awayBar").textContent="Abwesenheitsmodus · Gesperrt";["sheet","codeModal","askModal","typeForm"].forEach(id=>$(id).hidden=true)}setMode(vis.mode,idleLabel())}
function awayLog(typ,info){putSealed("away:"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),{typ,info:info||"",zeit:new Date().toISOString()})}
function notify(text){const n=ls.get("notify",null);if(!n||!n.url||!n.word||Date.now()-lastNotify<10*60000)return;lastNotify=Date.now();
  fetch(n.url+(n.url.includes("?")?"&":"?")+"a=melden&m="+encodeURIComponent(n.word)+"&text="+encodeURIComponent(text),{mode:"no-cors"}).catch(()=>{})}
async function startAway(){if(!voiceCode())return;convo=false;try{rec&&rec.abort()}catch{}listening=false;abortCtl?.abort();busy=false;
  away=true;ls.set("away",true);lockVault();if(cur.typ!=="haupt")setPerson(main().name);applyAway();awayLog("start");if(!stream)startRoom()}
function endAway(){away=false;ls.set("away",false);applyAway();awayLog("ende");quickUnlock()}
function awayVisitor(){awayLog("bewegung");notify(`Atlas: Bewegung im Biohacking-Raum um ${hhmm()} Uhr (Abwesenheitsmodus).`);
  speak(pick([`Hallo! ${main().name} ist gerade nicht da. Ich bin ${S.aname}, das Tablet ist gesperrt.`,`Hallo. ${main().name} ist nicht da. Der Raum ist im Abwesenheitsmodus.`]))}
function listenForCode(){
  convo=false;listening=false;try{rec&&rec.abort()}catch{}recActive=false;
  if(!SR){$("awayBar").textContent="Spracheingabe fehlt in diesem Browser";return}
  if(Date.now()<codeBlock){speak("Zu viele Versuche. Bitte später nochmal.");return}
  speak("Sprachcode bitte.",()=>{rec=new SR();rec.lang="de-DE";rec.interimResults=false;rec.continuous=false;let got="";
    rec.onstart=()=>{listening=true;setMode("listen","Sprachcode")};
    rec.onresult=e=>{got=[...e.results].map(r=>r[0].transcript).join(" ")};
    rec.onerror=()=>{listening=false};
    rec.onend=async()=>{listening=false;setMode("idle",idleLabel());if(!got.trim())return;
      if(await checkVoiceCode(got)){codeTries=0;endAway();setPerson(main().name);log=log.filter(m=>m.rolle!=="intern");speak(`Willkommen zurück, ${main().name}. Der Abwesenheitsmodus ist aus.`)}
      else{codeTries++;awayLog("code-falsch");notify(`Atlas: Falscher Sprachcode am Tablet um ${hhmm()} Uhr.`);
        if(codeTries>=3){codeBlock=Date.now()+5*60000;codeTries=0;speak("Das war nicht richtig. Das Tablet bleibt jetzt fünf Minuten gesperrt.")}else speak("Das war nicht richtig.")}};
    try{rec.start()}catch{}})}
// Keine Zoom-, Kontextmenü- oder Ziehgesten
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>{const t=e.target;if(away||!(t.closest&&t.closest("input,textarea")))e.preventDefault()});
document.addEventListener("dragstart",e=>e.preventDefault());

/* ================= Automatische Updates ================= */
const APP_VERSION="20261110-0758",ATLAS_REL="2.7.1";
async function checkUpdate(){try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
  if(j.v&&j.v!==APP_VERSION&&!busy&&!speaking()&&!listening){location.replace(location.pathname+"?v="+encodeURIComponent(j.v))}}catch{}}
setTimeout(checkUpdate,1500);setTimeout(loadKB,2500);setTimeout(loadKatalog,3500);setInterval(checkUpdate,10*60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});

/* ================= Start ================= */
function applyNames(){$("aname").textContent=S.aname;document.title=S.aname;setMode(vis.mode,idleLabel())}
function tick(){const d=new Date();$("clock").textContent=hhmm(d);$("dateline").textContent=d.toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
  if(!S.quick&&privKey&&Date.now()-unlockedAt>S.lockHours*3600e3)lockVault();
  if(dayKey()!==today){const old=today,L=log.slice();clearTimeout(protoTimer);
    (async()=>{try{const t=await summarize(old,L);if(t)await saveProto(old,SESSION,t)}catch{}})();today=dayKey();log=[];protoLen=0;persistChain=Promise.resolve()}}
setInterval(tick,15000);tick();applyNames();renderPerson();renderLock();applyAway();if(!away)quickUnlock();if(away)startRoom();
if(!window.isSecureContext||!crypto.subtle)showErr("Dieses Gerät erlaubt hier keine Verschlüsselung. Bitte über eine https-Adresse öffnen.");
if(!SR)$("state").textContent="Bereit · Spracheingabe nur in Safari oder Chrome";
</script>
