<style>
:root{--bg:#050c12;--panel:#0d1820;--panel2:#09131a;--line:#1c303a;--fg:#e4f2f2;--muted:#8aa5aa;--accent:#4fcfcb;--accent-2:#bdf3ef;--ink:#03161a;--glow:rgba(79,207,203,.14);--ok:#6fcf97;--teal:#7fd1c7;
--f-display:"Unbounded","Arial Black",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Hauptbildschirm: nur die Kugel. Alles andere liegt hinter dem Code. */
body{background:radial-gradient(ellipse 80% 70% at 50% 46%,var(--tint1,#0c2028) 0%,var(--tint2,#081620) 45%,#050c12 72%,#03080c 100%) fixed var(--bg)}
.top,.dock,#typeForm,.said,.heard,.state{display:none!important}
#app{grid-template-rows:1fr auto!important}
#listView{position:fixed;z-index:14;text-align:left;background:rgba(8,12,22,.9);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px 22px;overflow:auto;color:#eef2f7;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (orientation:landscape){#listView{top:24px;right:24px;bottom:24px;width:min(46vw,560px)}body.listOn #vis{transform:translateX(-24vw) scale(.8)}}
@media (orientation:portrait){#listView{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-height:60vh}body.listOn #vis{transform:translateY(-22vh) scale(.62)}}
#vis{transition:transform .5s ease}
/* Supplement-Karte: erscheint, solange Atlas über ein Supplement spricht – neben der Kugel (quer) bzw. oben (hochkant), nie über Kugel oder Knöpfen */
#suppCard{position:fixed;z-index:6;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:16px;background:rgba(6,16,22,.74);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--fg);box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 0 1px var(--glow) inset;pointer-events:none;opacity:0;transition:opacity .45s ease,transform .45s ease}
#suppCard.on{opacity:1}
#suppCard .sc-img{width:52px;height:52px;flex:0 0 52px;border-radius:12px;background:rgba(255,255,255,.04);display:grid;place-items:center;overflow:hidden}
#suppCard .sc-img img{width:100%;height:100%;object-fit:contain}
#suppCard .sc-img svg{width:60%;height:60%;color:var(--accent)}
#suppCard .sc-t{font-size:15px;font-weight:600;line-height:1.25;color:var(--fg)}#suppCard .sc-s{font-size:12px;color:var(--muted);margin-top:2px}
@media (min-aspect-ratio:4/3){#suppCard{left:max(16px,env(safe-area-inset-left));top:50%;transform:translate(-8px,-50%);flex-direction:column;text-align:center;padding:14px;width:min(calc((100vw - min(100vw,82vh,760px))/2 - 36px),230px)}
  #suppCard.on{transform:translate(0,-50%)}#suppCard .sc-img{width:100%;height:auto;aspect-ratio:1;flex:none}#suppCard .sc-img svg{width:42%;height:42%}}
@media not all and (min-aspect-ratio:4/3){#suppCard{top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-8px);max-width:min(72vw,420px)}#suppCard.on{transform:translate(-50%,0)}}
body.listOn #suppCard{display:none}
@media (prefers-reduced-motion:reduce){#suppCard{transition:opacity .2s}}
/* 2.23: Karte antippbar (öffnet die lokale Detailkarte); mehrere Produkte als kurze Liste in derselben Karte */
#suppCard.on{pointer-events:auto;cursor:pointer}
#scList{display:none}#suppCard.multi .sc-img,#suppCard.multi .sc-one{display:none}#suppCard.multi #scList{display:flex;flex-direction:column;gap:6px;width:100%}
.scRow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:4px;border-radius:10px;font:inherit;cursor:pointer}
.scRow:active{background:rgba(255,255,255,.06)}.scRow .ri{width:40px;height:40px;flex:0 0 40px;border-radius:9px;background:rgba(255,255,255,.04);display:grid;place-items:center;overflow:hidden}
.scRow .ri img{width:100%;height:100%;object-fit:contain}.scRow .ri svg{width:60%;height:60%;color:var(--accent)}.scRow .rt{display:block;font-size:13px;font-weight:600;line-height:1.2}.scRow .rs{display:block;font-size:11px;color:var(--muted);margin-top:1px}
#prodDet{position:fixed;z-index:16;inset:0;display:grid;place-items:center;background:rgba(2,6,10,.55);padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
#prodDet[hidden]{display:none}
#pdBox{text-align:left;width:min(560px,100%);max-height:100%;overflow:auto;background:rgba(8,14,20,.94);border:1px solid var(--line);border-radius:20px;padding:18px 20px;color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 1px var(--glow) inset;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pdHead{display:flex;gap:14px;align-items:center}.pdImg{width:96px;height:96px;flex:0 0 96px;border-radius:14px;background:rgba(255,255,255,.04);display:grid;place-items:center;overflow:hidden}

  </div>

<script>
/* Atlas Orb: Varianten (kern, gitter, schwarm), Effekte für den Kern (pur, funken, atmen, hud) und Farbpaletten. */
const ORB_PALETTES={
  glut:{name:"Glut",a:[232,147,90],b:[248,198,150],c:[255,96,48]},
  rotlicht:{name:"Rotlicht",a:[236,64,58],b:[255,160,140],c:[190,20,60]},
  arktis:{name:"Arktis",a:[90,178,255],b:[205,236,255],c:[60,105,255]},
  aurora:{name:"Aurora",a:[64,228,176],b:[196,255,228],c:[70,160,255]},
  plasma:{name:"Plasma",a:[176,98,255],b:[236,196,255],c:[255,72,196]},
  gold:{name:"Gold",a:[232,188,88],b:[255,238,176],c:[214,128,36]},
  spektrum:{name:"Spektrum",dynamic:true},
  // Farbstimmungen für den Ringkern (Grundfarbe Türkis-Cyan); Nordlicht wechselt sehr langsam und weich
  tuerkis:{name:"Türkis (Standard)",a:[52,214,212],b:[206,252,250],c:[24,150,186]},
  blau:{name:"Blau",a:[74,156,255],b:[208,230,255],c:[44,96,220]},
  violett:{name:"Violett",a:[160,118,255],b:[232,220,255],c:[110,72,220]},
  nordlicht:{name:"Nordlicht (mehrfarbig, weich)",soft:true},
  smaragd:{name:"Smaragd",a:[60,214,150],b:[208,252,228],c:[24,140,96]},
  bernstein:{name:"Bernstein (warm)",a:[255,178,84],b:[255,236,204],c:[200,110,40]},
  rose:{name:"Rosé",a:[240,128,170],b:[255,222,236],c:[170,70,120]},
  eis:{name:"Eisweiß",a:[180,214,232],b:[246,252,255],c:[110,150,180]},
  supernova:{name:"Supernova (bunt)",a:[52,214,212],b:[236,244,255],c:[150,100,255],multi:true},
  eigen:{name:"Eigene Farbe",a:[52,214,212],b:[206,252,250],c:[32,132,131]}

function mixc(a,b,u){return [0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*u))}

function makeOrb(cv,opt){

  const st={mode:"idle",energy:0,variant:(opt&&opt.variant)||"ruhe",palette:(opt&&opt.palette)||"glut",fx:(opt&&opt.fx)||"pur"};
  const fib=n=>{const out=[],ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,r=Math.sqrt(1-y*y),th=ga*i;out.push([Math.cos(th)*r,y,Math.sin(th)*r,Math.random()])}return out};
  const P1=fib(1200),P2=fib(260);
  // Nachbarn für das Gitter einmal vorberechnen
  const EDGES=[];for(let i=0;i<P2.length;i++){const d=[];for(let j=0;j<P2.length;j++)if(j!==i){const dx=P2[i][0]-P2[j][0],dy=P2[i][1]-P2[j][1],dz=P2[i][2]-P2[j][2];d.push([dx*dx+dy*dy+dz*dz,j])}d.sort((x,y)=>x[0]-y[0]);for(let k=0;k<3;k++)if(d[k][1]>i)EDGES.push([i,d[k][1]])}
  // Schwarm: Teilchen auf geneigten Bahnen
  const RINGS=[0,1,2,3,4].map(k=>({inc:0.35+k*0.55,node:k*1.26,r:1.05+k*0.09,spd:(k%2?-1:1)*(0.35+k*0.08),n:110}));
  const SW=[];RINGS.forEach((R,ri)=>{for(let i=0;i<R.n;i++)SW.push({ri,ph:i/R.n*6.283+Math.random()*0.05,j:Math.random()})});
  let rot=0,last=performance.now(),flow=0,flash=0,armed=false,spread=0,open=0,lmix=0,phase=0,prevMode="idle",emitAcc=0,bang=0,nova=0,nameA=1,thinkA=0,listenA=0,sleepA=0;const STARS=[];const waves=[];const t0=last;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rgb=c=>c.join(",");
  function colors(t){let p=ORB_PALETTES[st.palette]||ORB_PALETTES.glut;if(p.soft)p=rkColors(t||0);let a,b,c;
    if(p.dynamic){const h=t*24;a=hsl(h,0.85,0.62);b=hsl(h+40,0.9,0.82);c=hsl(h+150,0.85,0.6)}else{a=p.a;b=p.b;c=p.c}
    if(st.mode==="listen")return {a:rgb(c),b:rgb(b),c:rgb(a)};return {a:rgb(a),b:rgb(b),c:rgb(c)}}
  const env=t=>0.35+0.65*Math.abs(Math.sin(t*10.7)*Math.sin(t*3.3+1.1));
  function project(x,y,z,cr,sr,ct,stl){const x1=x*cr+z*sr,z1=-x*sr+z*cr,y1=y*ct-z1*stl,z2=y*stl+z1*ct,pr=1/(1.9-z2*0.6);return [x1*pr*1.25,y1*pr*1.25,(z2+1)/2]}

  function thinkArc(cx,cy,R,b,t,S){if(st.mode!=="think")return;ctx.beginPath();ctx.arc(cx,cy,R*1.5,t*3,t*3+1.4);ctx.strokeStyle=`rgba(${b},0.9)`;ctx.lineWidth=S*0.006;ctx.lineCap="round";ctx.stroke()}

    const {a,b,c}=colors(t),fx=st.fx||"pur";let E=st.energy;rot+=dt*(st.mode==="think"?1.8:st.mode==="speak"?0.75:0.22);
    // Silben-Spitzen erkennen: Blitz + Schockwelle
    if(st.mode==="speak"){if(E>0.74&&!armed){armed=true;flash=1;if(fx!=="pur")waves.push(0)}if(E<0.5)armed=false}
    flash*=Math.pow(0.015,dt);for(let i=0;i<waves.length;i++)waves[i]+=dt*1.5;while(waves.length&&waves[0]>1)waves.shift();
    const tgt=st.mode==="speak"?E:0;spread+=(tgt-spread)*Math.min(1,dt*(tgt>spread?9:2.5));
    const fl=fx==="funken"?flash:fx==="hud"?flash*0.5:0;
    const R=S*(fx==="hud"?0.2:0.29)*(st.mode==="idle"?1+0.025*Math.sin(t*1.3):1);glow(cx,cy,R,a,Math.min(1,E+fl*0.8),W,H);
    ctx.globalCompositeOperation="lighter";const cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(.35),stl=Math.sin(.35);
    const amp=st.mode==="speak"?0.05+0.24*E:st.mode==="listen"?0.04+0.09*E:st.mode==="think"?0.06:0.022;
    const sparkSeed=Math.floor(t*24);
    for(let i=0;i<P1.length;i++){const p=P1[i];const n=Math.sin(p[0]*4+t*2.3+p[3]*6)*Math.sin(p[1]*5-t*1.9)*0.6+Math.sin(p[2]*6+t*3.1)*0.4;
      let k=1+amp*n,px0=p[0],py0=p[1],pz0=p[2];

      const [x,y,d0]=project(px0*k,py0*k,pz0*k,cr,sr,ct,stl),d=Math.max(0,Math.min(1,d0));

      const al=Math.min(1,(0.12+0.78*d)*(1+fl*0.8)*(fx==="atmen"?1-0.35*spread*p[3]:1));
      ctx.fillStyle=`rgba(${col},${al})`;ctx.beginPath();ctx.arc(cx+x*R,cy+y*R,S*(0.0016+0.0032*d)*(1+E*0.7)*(spark?2.4:1+fl*0.6),0,6.283);ctx.fill()}
    ctx.globalCompositeOperation="source-over";ctx.lineWidth=Math.max(1,S*0.0028);
    for(const w of waves){ctx.beginPath();ctx.arc(cx,cy,R*(1+w*1.1),0,6.283);ctx.strokeStyle=`rgba(${b},${(1-w)*0.55})`;ctx.lineWidth=S*(0.006*(1-w)+0.001);ctx.stroke()}
    ctx.lineWidth=Math.max(1,S*0.0028);
    if(fx!=="hud"){
      for(let i=0;i<2;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*(i?-0.18:0.13)+i*1.2);ctx.scale(1,0.26+i*0.12);ctx.beginPath();ctx.arc(0,0,R*(1.34+i*0.13),0,6.283);ctx.restore();ctx.strokeStyle=`rgba(${i?c:b},${0.2+0.3*E+0.4*fl})`;ctx.stroke()}
      ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*0.08);for(let i=0;i<90;i++){ctx.rotate(6.283/90);const mj=i%9===0,L=R*(0.03+(mj?0.05:0)+E*0.1*Math.abs(Math.sin(i*1.7+t*7)));ctx.fillStyle=`rgba(${a},${mj?0.75:0.32})`;ctx.fillRect(R*1.6,-S*0.0012,L,S*0.0024)}ctx.restore();
    }else hud(t,S,cx,cy,R,a,b,c,E,fl);

  function hud(t,S,cx,cy,R,a,b,c,E,fl){
    // Stimmen-Ring: radiale Balken

      const r0=R*1.2,L=R*(0.02+0.32*v);ctx.strokeStyle=`rgba(${i%12===0?b:a},${0.35+0.5*v})`;ctx.lineWidth=S*0.004;ctx.beginPath();ctx.moveTo(Math.cos(ang)*r0,Math.sin(ang)*r0);ctx.lineTo(Math.cos(ang)*(r0+L),Math.sin(ang)*(r0+L));ctx.stroke()}

      for(let j=0;j<seg;j++){const s0=j/seg*6.283,len=6.283/seg*(0.55+0.3*Math.sin(t*0.7+j+k));ctx.beginPath();ctx.arc(0,0,R*rr,s0,s0+len);ctx.strokeStyle=`rgba(${col},${0.25+0.35*E+0.3*fl})`;ctx.stroke()}ctx.restore()});

    const sa=t*1.1;for(let j=0;j<14;j++){const an=sa-j*0.035;ctx.strokeStyle=`rgba(${b},${0.32*(1-j/14)})`;ctx.lineWidth=S*0.003;ctx.beginPath();ctx.moveTo(Math.cos(an)*R*1.12,Math.sin(an)*R*1.12);ctx.lineTo(Math.cos(an)*R*1.58,Math.sin(an)*R*1.58);ctx.stroke()}

    ctx.rotate(-t*0.04);for(let i=0;i<120;i++){ctx.rotate(6.283/120);const mj=i%10===0;ctx.fillStyle=`rgba(${a},${mj?0.8:0.3})`;ctx.fillRect(R*2.02,-S*0.001,R*(mj?0.07:0.03),S*0.002)}
    ctx.restore();
    ctx.font=`500 ${Math.round(S*0.024)}px "IBM Plex Mono",ui-monospace,monospace`;ctx.textAlign="center";ctx.fillStyle=`rgba(${b},0.75)`;
    const lbl=st.mode==="speak"?"VOX "+String(Math.round(E*100)).padStart(3,"0"):st.mode==="listen"?"INPUT AKTIV":st.mode==="think"?"ANALYSE":"BEREIT";
    ctx.fillText(lbl,cx,cy+R*2.28);ctx.fillStyle=`rgba(${a},0.5)`;ctx.fillText((st.label||"ATLAS")+" · "+new Date().toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),cx,cy-R*2.2)}
  function ruhe(t,dt,W,H,S,cx,cy){
    // Ruhige Kugel: geordnete Punkte, langsame Drehung, sanftes Öffnen und Schließen beim Sprechen. Kein Flackern.
    const tgt=st.mode==="speak"?1:st.mode==="listen"?0.06:0;
    open+=(tgt-open)*Math.min(1,dt*2.2);lmix+=((st.mode==="listen"?1:0)-lmix)*Math.min(1,dt*1.5);

    rot+=dt*(0.1+0.06*open)*(1-0.7*sleepA);
    const pulse=st.mode==="speak"?0.06*Math.sin(phase):(0.018+0.03*sleepA)*Math.sin(phase);

    let p=ORB_PALETTES[st.palette]||ORB_PALETTES.glut;if(p.soft)p=rkColors(t||0);

    const colAt0=y=>{if(p.dynamic)return hsl(base+y*55+lmix*130,0.75,0.66);const A=lmix?mixc(p.a,p.c,lmix):p.a,B=lmix?mixc(p.b,p.c,lmix*0.5):p.b,u=(y+1)/2;return mixc(A,B,u)};

    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(R*1.8,S*0.5));g.addColorStop(0,`rgba(${mid},${(0.2+0.12*open)*(1-0.5*sleepA)})`);g.addColorStop(.5,`rgba(${mid},${0.06+0.05*open})`);g.addColorStop(1,`rgba(${mid},0)`);

      ctx.fillStyle=`rgba(${col},${(0.1+0.7*d)*(1-0.4*open)*(1-0.55*sleepA)})`;ctx.beginPath();ctx.arc(cx+x*R,cy+y*R,S*(0.0018+0.0026*d),0,6.283);ctx.fill()}

      ctx.fillStyle=gw;ctx.beginPath();ctx.arc(cx,cy,rw,0,6.283);ctx.fill()}

    ctx.strokeStyle=`rgba(${mid},${0.14+0.1*open})`;ctx.lineWidth=Math.max(1,S*0.002);ctx.stroke();
    listenA+=((st.mode==="listen"?1:0)-listenA)*Math.min(1,dt*(st.mode==="listen"?4:6));
    if(listenA>0.02){const LC=st.listenColor||"64,226,196",rr=Math.min(R*1.55,S*0.45),E2=Math.min(1,st.energy);
      const lg=ctx.createRadialGradient(cx,cy,rr*0.9,cx,cy,rr*1.12);lg.addColorStop(0,`rgba(${LC},0)`);lg.addColorStop(.5,`rgba(${LC},${(0.16+0.22*E2)*listenA})`);lg.addColorStop(1,`rgba(${LC},0)`);

      ctx.beginPath();ctx.arc(cx,cy,rr,0,6.283);ctx.strokeStyle=`rgba(${LC},${(0.7+0.3*E2)*listenA})`;ctx.lineWidth=S*(0.005+0.003*E2);ctx.stroke()}

const rnd=n=>crypto.getRandomValues(new Uint8Array(n));

let pubKey=null,privKey=null,unlockedAt=0,bridge=null,mem={notes:[],protos:{},prefs:[]};
const vault=()=>ls.get("vault",null);
async function kek(code,salt,iter){const base=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

  pubKey=kp.publicKey;privKey=kp.privateKey;unlockedAt=Date.now();mem={notes:[],protos:{},prefs:[]};if(S.quick)ls.set("devkey",toB64(pk8));
  if(log.length)persistLog();renderLock()}

function lockVault(forget){if(forget)ls.del("devkey");privKey=null;bridge=null;mem={notes:[],protos:{},prefs:[]};renderLock();if(!$("sheet").hidden&&pane!=="heute")renderPane()}
async function seal(obj){const pk=await getPub();if(!pk)return null;
  const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]),raw=await crypto.subtle.exportKey("raw",aes);
  const ek=await crypto.subtle.encrypt(RSA,pk,raw),iv=rnd(12),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,te.encode(JSON.stringify(obj)));

async function sha(t){const b=await crypto.subtle.digest("SHA-256",te.encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

async function setVoiceCode(phrase){const w=words(phrase);if(w.length<3)return false;const salt=toB64(rnd(16));ls.set("voicecode",{salt,hash:await sha(salt+"|"+w.join(" ")),n:w.length});return true}
async function checkVoiceCode(said){const vc=voiceCode();if(!vc)return false;const w=words(said);for(let i=0;i+vc.n<=w.length;i++)if(await sha(vc.salt+"|"+w.slice(i,i+vc.n).join(" "))===vc.hash)return true;return false}
